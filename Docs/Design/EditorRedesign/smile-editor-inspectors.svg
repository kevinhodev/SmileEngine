    <text x="304" y="388" text-anchor="end" class="mono tm" font-size="10">12</text>
    <rect x="14" y="402" width="14" height="14" rx="2" fill="#7A5A44" stroke="#333338"/>
    <text x="38" y="410" class="sans ts" font-size="12">M_Facade_Paris</text>
    <text x="306" y="410" text-anchor="end" class="mono tm" font-size="10">214 objs</text>
    <rect x="14" y="428" width="14" height="14" rx="2" fill="#8C2F2A" stroke="#333338"/>
    <text x="38" y="436" class="sans ts" font-size="12">M_Awning_Red</text>
    <text x="306" y="436" text-anchor="end" class="mono tm" font-size="10">36 objs</text>
    <rect x="14" y="454" width="14" height="14" rx="2" fill="#41535A" stroke="#333338"/>
    <text x="38" y="462" class="sans ts" font-size="12">M_Glass_Cafe</text>
    <text x="306" y="462" text-anchor="end" class="mono tm" font-size="10">18 objs</text>
    <text x="38" y="488" class="mono tm" font-size="10.5">+ 9 materiais&#8230;</text>
    <rect x="14" y="508" width="292" height="1" fill="#26262B"/>
    <!-- ESTATISTICAS -->
    <text x="16" y="530" class="mono hdr">ESTAT&#205;STICAS</text>
    <text x="304" y="530" text-anchor="end" class="mono tm" font-size="9">AGREGADO</text>
    <text x="16" y="556" class="sans ts" font-size="12">Objetos</text>
    <text x="306" y="556" text-anchor="end" class="mono tp" font-size="11">1 591</text>
    <text x="16" y="582" class="sans ts" font-size="12">Tri&#226;ngulos</text>
    <text x="306" y="582" text-anchor="end" class="mono tp" font-size="11">1 243 812</text>
    <text x="16" y="608" class="sans ts" font-size="12">VRAM geometria</text>
    <text x="306" y="608" text-anchor="end" class="mono tp" font-size="11">142.3 MB</text>
    <text x="16" y="634" class="sans ts" font-size="12">Draw calls</text>
    <text x="306" y="634" text-anchor="end" class="mono tp" font-size="11">38</text>
    <rect x="0" y="666" width="320" height="1" fill="#26262B"/>
    <text x="16" y="683" class="mono tm" font-size="9.5">toggles em lote aplicam aos 1 591 filhos</text>
  </g>

  <!-- ================= PAINEL 2: componente de ambiente ================= -->
  <text x="364" y="24" class="mono tm" font-size="10" letter-spacing="1.2">SELE&#199;&#195;O: COMPONENTE DE AMBIENTE</text>
  <g transform="translate(364,40)">
    <rect x="0" y="0" width="320" height="700" fill="#111113" stroke="#26262B"/>
    <text x="16" y="17" class="mono hdr">INSPECTOR</text>
    <use href="#i-pin" x="290" y="9" width="15" height="15" color="#5F5F66"/>
    <rect x="0" y="32" width="320" height="1" fill="#26262B"/>
    <!-- card de selecao com toggle master -->
