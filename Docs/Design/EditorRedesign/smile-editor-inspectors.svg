    <rect x="26" y="56" width="30" height="30" rx="3" fill="rgba(255,107,44,0.12)" stroke="rgba(255,107,44,0.45)"/>
    <use href="#i-cloud" x="33" y="63" width="16" height="16" color="#FF6B2C"/>
