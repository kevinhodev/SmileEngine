<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780">
  <!-- Signal Graphite - inspectors contextuais: grupo vs componente de ambiente -->
  <style>
    .sans { font-family: Inter, 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace; }
    .tp { fill: #F2F2F0; }
    .ts { fill: #A0A0A8; }
    .tm { fill: #5F5F66; }
    .tacc { fill: #FF6B2C; }
    .hdr { fill: #A0A0A8; font-size: 10px; letter-spacing: 1.6px; font-weight: 600; }
    text { dominant-baseline: middle; }
  </style>
  <defs>
    <symbol id="i-chevd" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chevr" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M6.5 19a4.5 4.5 0 0 1-.68-8.95A7 7 0 0 1 19.4 11 4 4 0 0 1 18 19z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 4h6v5l2.5 3.5h-11L9 9z"/></g></symbol>
  </defs>

  <rect x="0" y="0" width="700" height="780" fill="#09090A"/>

  <!-- ================= PAINEL 1: grupo ================= -->
  <text x="16" y="24" class="mono tm" font-size="10" letter-spacing="1.2">SELE&#199;&#195;O: GRUPO (PASTA NA &#193;RVORE)</text>
  <g transform="translate(16,40)">
    <rect x="0" y="0" width="320" height="700" fill="#111113" stroke="#26262B"/>
    <text x="16" y="17" class="mono hdr">INSPECTOR</text>
    <use href="#i-pin" x="290" y="9" width="15" height="15" color="#5F5F66"/>
    <rect x="0" y="32" width="320" height="1" fill="#26262B"/>
    <!-- card de selecao -->
    <rect x="14" y="44" width="292" height="54" rx="4" fill="#18181B" stroke="#26262B"/>
    <rect x="26" y="56" width="30" height="30" rx="3" fill="rgba(255,107,44,0.12)" stroke="rgba(255,107,44,0.45)"/>
    <use href="#i-folder" x="33" y="63" width="16" height="16" color="#FF6B2C"/>
    <text x="68" y="66" class="sans tp" font-size="14" font-weight="600">BistroExterior</text>
    <text x="68" y="84" class="mono tm" font-size="9.5" letter-spacing="0.6">GRUPO &#183; 1 591 OBJETOS &#183; 1.24M TRI</text>
    <!-- TRANSFORM -->
    <text x="16" y="126" class="mono hdr">TRANSFORM</text>
    <text x="304" y="126" text-anchor="end" class="mono tm" font-size="9">PIV&#212; DO GRUPO</text>
    <text x="16" y="150" class="sans tm" font-size="11">Posi&#231;&#227;o</text>
    <g>
      <rect x="14" y="160" width="92" height="26" rx="3" fill="#18181B" stroke="#26262B"/>
      <rect x="14" y="160" width="2" height="26" fill="#FF5C5C"/>
      <text x="24" y="174" class="mono tm" font-size="10">X</text>
      <text x="98" y="174" text-anchor="end" class="mono tp" font-size="11">-12.400</text>
      <rect x="114" y="160" width="92" height="26" rx="3" fill="#18181B" stroke="#26262B"/>
      <rect x="114" y="160" width="2" height="26" fill="#46D68C"/>
      <text x="124" y="174" class="mono tm" font-size="10">Y</text>
      <text x="198" y="174" text-anchor="end" class="mono tp" font-size="11">0.000</text>
      <rect x="214" y="160" width="92" height="26" rx="3" fill="#18181B" stroke="#26262B"/>
      <rect x="214" y="160" width="2" height="26" fill="#6FA8FF"/>
      <text x="224" y="174" class="mono tm" font-size="10">Z</text>
      <text x="298" y="174" text-anchor="end" class="mono tp" font-size="11">8.250</text>
    </g>
    <rect x="14" y="204" width="292" height="1" fill="#26262B"/>
    <!-- LOTE -->
    <text x="16" y="226" class="mono hdr">A&#199;&#213;ES EM LOTE</text>
    <text x="16" y="252" class="sans ts" font-size="12">Vis&#237;veis</text>
    <text x="306" y="252" text-anchor="end" class="mono tp" font-size="11">1 589 / 1 591</text>
    <g>
      <rect x="14" y="268" width="64" height="24" rx="3" fill="#18181B" stroke="#26262B"/>
      <text x="46" y="281" text-anchor="middle" class="mono ts" font-size="9.5">ISOLAR</text>
      <rect x="86" y="268" width="72" height="24" rx="3" fill="#18181B" stroke="#26262B"/>
      <text x="122" y="281" text-anchor="middle" class="mono ts" font-size="9.5">OCULTAR</text>
      <rect x="166" y="268" width="80" height="24" rx="3" fill="#18181B" stroke="#26262B"/>
      <text x="206" y="281" text-anchor="middle" class="mono ts" font-size="9.5">DUPLICAR</text>
    </g>
    <text x="16" y="316" class="sans ts" font-size="12.5">Projeta sombras</text>
    <text x="236" y="316" text-anchor="end" class="mono tm" font-size="9">MISTO</text>
    <rect x="276" y="308" width="30" height="16" rx="8" fill="#18181B" stroke="rgba(255,107,44,0.5)"/>
    <rect x="287" y="314" width="8" height="4" rx="1" fill="#FF6B2C"/>
    <text x="16" y="344" class="sans ts" font-size="12.5">Din&#226;mico</text>
    <rect x="276" y="336" width="30" height="16" rx="8" fill="#18181B" stroke="#333338"/>
    <circle cx="284" cy="344" r="6" fill="#5F5F66"/>
    <rect x="14" y="366" width="292" height="1" fill="#26262B"/>
    <!-- MATERIAIS USADOS -->
