    <!-- sliders primarios -->
    <text x="16" y="160" class="sans ts" font-size="12.5">Cobertura</text>
    <rect x="256" y="150" width="50" height="20" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="160" text-anchor="end" class="mono tp" font-size="11">45%</text>
    <rect x="14" y="180" width="292" height="3" rx="1.5" fill="#26262B"/>
    <rect x="14" y="180" width="131" height="3" rx="1.5" fill="#FF6B2C"/>
    <rect x="140" y="175" width="10" height="13" rx="2" fill="#F2F2F0"/>
    <text x="16" y="208" class="sans ts" font-size="12.5">Densidade</text>
    <rect x="256" y="198" width="50" height="20" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="208" text-anchor="end" class="mono tp" font-size="11">4.00</text>
    <rect x="14" y="228" width="292" height="3" rx="1.5" fill="#26262B"/>
    <rect x="14" y="228" width="115" height="3" rx="1.5" fill="#FF6B2C"/>
    <rect x="124" y="223" width="10" height="13" rx="2" fill="#F2F2F0"/>
    <rect x="14" y="250" width="292" height="1" fill="#26262B"/>
    <!-- FORMA E DETALHE (expandida) -->
    <use href="#i-chevd" x="14" y="264" width="13" height="13" color="#5F5F66"/>
    <text x="34" y="271" class="mono hdr">FORMA E DETALHE</text>
    <text x="16" y="298" class="sans ts" font-size="12">Eros&#227;o</text>
    <rect x="230" y="288" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="299" text-anchor="end" class="mono tp" font-size="11">45%</text>
    <rect x="231" y="307" width="34" height="2" fill="#FF6B2C"/>
    <text x="16" y="330" class="sans ts" font-size="12">Varia&#231;&#227;o dos picos</text>
    <rect x="230" y="320" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="331" text-anchor="end" class="mono tp" font-size="11">100%</text>
    <rect x="231" y="339" width="74" height="2" fill="#FF6B2C"/>
    <!-- bipolar -->
    <text x="16" y="364" class="sans ts" font-size="12">Tipo da nuvem</text>
    <text x="306" y="364" text-anchor="end" class="mono tp" font-size="11">Equilibrado</text>
    <rect x="14" y="382" width="292" height="3" rx="1.5" fill="#26262B"/>
    <rect x="159" y="378" width="2" height="11" fill="#5F5F66"/>
    <rect x="155" y="377" width="10" height="13" rx="2" fill="#F2F2F0"/>
    <text x="14" y="402" class="mono tm" font-size="9">CAMADAS</text>
    <text x="306" y="402" text-anchor="end" class="mono tm" font-size="9">VERTICAL</text>
    <rect x="14" y="418" width="292" height="1" fill="#26262B"/>
    <!-- CAMADA E MOVIMENTO (recolhida) -->
