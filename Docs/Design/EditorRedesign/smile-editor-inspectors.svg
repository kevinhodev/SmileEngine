    <text x="34" y="437" class="mono hdr">CAMADA E MOVIMENTO</text>
    <text x="304" y="437" text-anchor="end" class="mono tm" font-size="10">2.0&#8211;5.0 KM</text>
    <rect x="14" y="454" width="292" height="1" fill="#26262B"/>
    <!-- LUZ E ATMOSFERA (expandida) -->
    <use href="#i-chevd" x="14" y="466" width="13" height="13" color="#5F5F66"/>
    <text x="34" y="473" class="mono hdr">LUZ E ATMOSFERA</text>
    <text x="16" y="500" class="sans ts" font-size="12">Dispers&#227;o frontal</text>
    <rect x="230" y="490" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="501" text-anchor="end" class="mono tp" font-size="11">0.80</text>
    <rect x="231" y="509" width="63" height="2" fill="#FF6B2C"/>
    <text x="16" y="532" class="sans ts" font-size="12">Silver lining</text>
    <rect x="230" y="522" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="533" text-anchor="end" class="mono tp" font-size="11">50%</text>
    <rect x="231" y="541" width="38" height="2" fill="#FF6B2C"/>
    <text x="16" y="564" class="sans ts" font-size="12">Luz ambiente</text>
    <rect x="230" y="554" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="565" text-anchor="end" class="mono tp" font-size="11">&#215;1.00</text>
    <rect x="231" y="573" width="25" height="2" fill="#FF6B2C"/>
    <text x="16" y="596" class="sans ts" font-size="12.5">Sombras no mundo</text>
    <rect x="276" y="588" width="30" height="16" rx="8" fill="#FF6B2C"/>
    <circle cx="298" cy="596" r="6" fill="#F2F2F0"/>
    <text x="16" y="626" class="sans ts" font-size="12">Intensidade da sombra</text>
    <rect x="230" y="616" width="76" height="22" rx="3" fill="#18181B" stroke="#26262B"/>
    <text x="298" y="627" text-anchor="end" class="mono tp" font-size="11">70%</text>
    <rect x="231" y="635" width="53" height="2" fill="#FF6B2C"/>
    <rect x="14" y="650" width="292" height="1" fill="#26262B"/>
    <!-- DISTRIBUICAO (recolhida) -->
    <use href="#i-chevr" x="14" y="660" width="13" height="13" color="#5F5F66"/>
    <text x="34" y="667" class="mono hdr">DISTRIBUI&#199;&#195;O</text>
    <text x="304" y="667" text-anchor="end" class="mono tm" font-size="10">SEED 4217</text>
    <rect x="0" y="682" width="320" height="1" fill="#26262B"/>
    <!-- footer -->
    <text x="16" y="692" class="mono tm" font-size="9.5">componente de ambiente &#183; tempo real</text>
  </g>

  <!-- legenda inferior -->
  <text x="16" y="764" class="mono tm" font-size="9.5">SIGNAL GRAPHITE &#183; INSPECTORS CONTEXTUAIS &#183; O CONTE&#218;DO SE ADAPTA AO TIPO DA SELE&#199;&#195;O</text>
</svg>
