<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de ray tracing da SmileEngine</title>
  <desc id="description">Diagrama técnico em quatro camadas: cena e estruturas de aceleração, dados compartilhados na GPU, passes inline ray tracing e reconstrução da imagem.</desc>

  <defs>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        fill: #172033;
      }
      .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.8px;
        fill: #2563eb;
      }
      .title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-size: 14px;
        fill: #64748b;
      }
      .meta {
        font-size: 12px;
        fill: #64748b;
      }
      .lane-number {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        fill: #2563eb;
      }
      .lane-title {
        font-size: 14px;
        font-weight: 700;
        fill: #334155;
      }
      .lane-subtitle {
        font-size: 11px;
        fill: #94a3b8;
      }
      .card-title {
        font-size: 15px;
        font-weight: 700;
      }
      .body {
        font-size: 12px;
        fill: #475569;
      }
      .small {
        font-size: 11px;
        fill: #64748b;
      }
      .tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .mono {
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 11px;
        fill: #475569;
      }
      .lane {
        fill: #ffffff;
        stroke: #dbe3ee;
        stroke-width: 1;
      }
      .lane-rule {
        stroke: #e2e8f0;
        stroke-width: 1;
      }
      .card {
        fill: #ffffff;
        stroke: #b9c6d8;
        stroke-width: 1.2;
      }
      .card-blue {
        fill: #f4f8ff;
        stroke: #7fa6dc;
        stroke-width: 1.2;
      }
      .card-teal {
        fill: #f2fbf9;
        stroke: #71a99f;
        stroke-width: 1.2;
      }
      .card-violet {
        fill: #f8f6ff;
        stroke: #9b8fc5;
        stroke-width: 1.2;
      }
      .bus {
        fill: #eef4ff;
        stroke: #7fa6dc;
        stroke-width: 1.2;
      }
      .flow {
        fill: none;
        stroke: #2563eb;
        stroke-width: 1.8;
        marker-end: url(#arrow-primary);
      }
      .flow-secondary {
        fill: none;
        stroke: #64748b;
        stroke-width: 1.4;
        marker-end: url(#arrow-secondary);
      }
      .flow-history {
        fill: none;
        stroke: #64748b;
        stroke-width: 1.3;
        stroke-dasharray: 5 5;
        marker-end: url(#arrow-secondary);
      }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f7f9fc"/>
  <rect x="0" y="0" width="8" height="116" fill="#2563eb"/>

  <g aria-label="Cabeçalho">
    <text x="56" y="34" class="kicker">SMILEENGINE / RENDERER</text>
    <text x="56" y="70" class="title">Fluxo de Ray Tracing</text>
    <text x="56" y="96" class="subtitle">Dados persistentes, passes inline DXR e reconstrução da imagem</text>
    <text x="1544" y="48" text-anchor="end" class="meta">DirectX 12 · DXR 1.1 · inline RayQuery</text>
    <text x="1544" y="72" text-anchor="end" class="meta">Shader Model 6.6 · 2 frames in flight</text>
    <line x1="40" y1="116" x2="1560" y2="116" stroke="#cbd5e1"/>
  </g>

  <!-- 01 / Cena e acceleration structures -->
  <g id="scene" aria-label="Cena e estruturas de aceleração">
    <rect x="40" y="140" width="1520" height="170" rx="8" class="lane"/>
    <line x1="205" y1="140" x2="205" y2="310" class="lane-rule"/>

    <text x="64" y="172" class="lane-number">01</text>
    <text x="64" y="198" class="lane-title">CENA E AS</text>
    <text x="64" y="220" class="lane-subtitle">CPU ’ GPU</text>

    <rect x="230" y="180" width="200" height="92" rx="6" class="card"/>
    <text x="248" y="207" class="card-title">FScene</text>
    <text x="248" y="231" class="body">Meshes, materiais e luzes</text>
    <text x="248" y="251" class="small">Transformações e flags RT</text>

    <rect x="480" y="180" width="230" height="92" rx="6" class="card-blue"/>
    <text x="498" y="207" class="card-title">FRaytracingScene</text>
    <text x="498" y="231" class="body">Build por cena</text>
    <text x="498" y="251" class="small">Atualização leve por frame</text>

    <rect x="770" y="180" width="170" height="92" rx="6" class="card"/>
    <text x="788" y="207" class="card-title">BLAS pool</text>
    <text x="788" y="231" class="body">Malhas únicas</text>
    <text x="788" y="251" class="mono">compactado</text>

    <rect x="990" y="180" width="170" height="92" rx="6" class="card"/>
    <text x="1008" y="207" class="card-title">TLAS</text>
    <text x="1008" y="231" class="body">Instâncias visíveis</text>
    <text x="1008" y="251" class="mono">mask · InstanceID</text>

    <rect x="1210" y="180" width="310" height="92" rx="6" class="card"/>
    <text x="1228" y="207" class="card-title">InstanceGeo + materiais</text>
    <text x="1228" y="231" class="body">Geometria e shading compartilhados</text>
    <text x="1228" y="251" class="mono">VB/IB bindless · alpha test</text>

    <path d="M430 226H476" class="flow"/>
    <path d="M710 226H766" class="flow"/>
    <path d="M940 226H986" class="flow"/>
    <path d="M1160 226H1206" class="flow-secondary"/>
  </g>

  <!-- 02 / Recursos compartilhados -->
  <g id="shared-data" aria-label="Dados compartilhados na GPU">
    <rect x="40" y="330" width="1520" height="215" rx="8" class="lane"/>
    <line x1="205" y1="330" x2="205" y2="545" class="lane-rule"/>

    <text x="64" y="362" class="lane-number">02</text>
    <text x="64" y="388" class="lane-title">DADOS GPU</text>
    <text x="64" y="410" class="lane-subtitle">Por frame / históricos</text>

    <rect x="230" y="372" width="220" height="92" rx="6" class="card"/>
    <text x="248" y="399" class="card-title">G-buffer + depth</text>
    <text x="248" y="423" class="body">Superfície primária raster</text>
    <text x="248" y="443" class="small">A/B/C · velocity · IDs</text>

    <rect x="480" y="372" width="220" height="92" rx="6" class="card-blue"/>
    <text x="498" y="399" class="card-title">Temporal motion</text>
    <text x="498" y="423" class="body">Vetores duais confiáveis</text>
    <text x="498" y="443" class="small">Surface history + transforms</text>

    <rect x="730" y="372" width="220" height="92" rx="6" class="card"/>
    <text x="748" y="399" class="card-title">Domínio de luzes</text>
    <text x="748" y="423" class="body">Analíticas + mesh lights</text>
    <text x="748" y="443" class="small">ReGIR para hits secundários</text>

    <rect x="980" y="372" width="220" height="92" rx="6" class="card-teal"/>
    <text x="998" y="399" class="card-title">DDGI</text>
    <text x="998" y="423" class="body">Volume de probes</text>
    <text x="998" y="443" class="small">Fallback indireto estável</text>

    <rect x="1230" y="372" width="290" height="92" rx="6" class="card-teal"/>
    <text x="1248" y="399" class="card-title">SHaRC / Radiance cache</text>
    <text x="1248" y="423" class="body">Radiância de mundo em hash</text>
    <text x="1248" y="443" class="small">Terminador primário de hits elegíveis</text>

    <rect x="230" y="490" width="1290" height="40" rx="5" class="bus"/>
    <text x="248" y="507" class="tag" fill="#1d4ed8">CONTRATO COMPARTILHADO DOS PASSES RT</text>
    <text x="248" y="522" class="small">TLAS · geometria bindless · materiais · céu · luzes · superfície primária · motion · caches de GI</text>

    <path d="M340 464V486" class="flow-history"/>
    <path d="M590 464V486" class="flow-history"/>
    <path d="M840 464V486" class="flow-history"/>
    <path d="M1090 464V486" class="flow-history"/>
    <path d="M1375 464V486" class="flow-history"/>
    <path d="M1365 272V324H1420V368" class="flow-secondary"/>
    <path d="M1075 272V316H280V368" class="flow-secondary"/>
  </g>

  <!-- 03 / Inline RT passes -->
  <g id="rt-passes" aria-label="Passes inline ray tracing">
    <rect x="40" y="565" width="1520" height="240" rx="8" class="lane"/>
    <line x1="205" y1="565" x2="205" y2="805" class="lane-rule"/>

    <text x="64" y="597" class="lane-number">03</text>
    <text x="64" y="623" class="lane-title">INLINE RT</text>
    <text x="64" y="645" class="lane-subtitle">Passes por pixel</text>

    <rect x="230" y="604" width="1290" height="42" rx="5" fill="#172033"/>
    <text x="248" y="630" class="tag" fill="#ffffff">DXR 1.1 / RAYQUERY</text>
    <text x="1502" y="630" text-anchor="end" font-size="11" fill="#cbd5e1">HitShading compartilhado · política de indireto em IndirectPolicy.h</text>

    <rect x="230" y="674" width="400" height="102" rx="6" class="card-blue"/>
    <rect x="230" y="674" width="6" height="102" fill="#2563eb"/>
    <text x="252" y="698" class="tag" fill="#1d4ed8">DIRETA LOCAL</text>
    <text x="252" y="725" class="card-title">ReSTIR DI</text>
    <text x="252" y="748" class="body">Candidatas ’ reuso temporal / espacial</text>
    <text x="252" y="768" class="small">Visibilidade final por shadow ray</text>

    <rect x="670" y="674" width="400" height="102" rx="6" class="card-teal"/>
    <rect x="670" y="674" width="6" height="102" fill="#0f766e"/>
    <text x="692" y="698" class="tag" fill="#0f766e">INDIRETA DIFUSA</text>
    <text x="692" y="725" class="card-title">ReSTIR GI</text>
    <text x="692" y="748" class="body">Final gather + reservoirs temporais</text>
    <text x="692" y="768" class="small">Primário: SHaRC · fallback: DDGI / zero</text>

    <rect x="1110" y="674" width="410" height="102" rx="6" class="card-violet"/>
    <rect x="1110" y="674" width="6" height="102" fill="#6d5cae"/>
    <text x="1132" y="698" class="tag" fill="#6d5cae">INDIRETA ESPECULAR</text>
    <text x="1132" y="725" class="card-title">Reflexos RT</text>
    <text x="1132" y="748" class="body">Trace inline em meia / plena resolução</text>
    <text x="1132" y="768" class="small">Resolve temporal interno ou sinal para NRD / RR</text>

    <path d="M430 530V600" class="flow"/>
    <path d="M870 530V600" class="flow"/>
    <path d="M1315 530V600" class="flow"/>
    <path d="M430 646V670" class="flow"/>
    <path d="M870 646V670" class="flow"/>
    <path d="M1315 646V670" class="flow"/>
  </g>

  <!-- 04 / Reconstruction and output -->
  <g id="output" aria-label="Reconstrução e saída">
    <rect x="40" y="825" width="1520" height="160" rx="8" class="lane"/>
    <line x1="205" y1="825" x2="205" y2="985" class="lane-rule"/>

    <text x="64" y="857" class="lane-number">04</text>
    <text x="64" y="883" class="lane-title">SAÍDA</text>
    <text x="64" y="905" class="lane-subtitle">Reconstrução / display</text>

    <rect x="230" y="866" width="350" height="80" rx="6" class="card-violet"/>
    <text x="248" y="893" class="card-title">Condicionamento do sinal</text>
    <text x="248" y="916" class="body">NRD RELAX · temporal interno · bypass</text>
    <text x="248" y="936" class="small">Difuso, especular e direta em instâncias próprias</text>

    <rect x="640" y="866" width="350" height="80" rx="6" class="card-blue"/>
    <text x="658" y="893" class="card-title">Composição HDR</text>
    <text x="658" y="916" class="body">Deferred + DI + GI + reflexos</text>
    <text x="658" y="936" class="small">Scene color antes dos overlays do editor</text>

    <rect x="1050" y="866" width="470" height="80" rx="6" class="card"/>
    <text x="1068" y="893" class="card-title">Reconstrução temporal e display</text>
    <text x="1068" y="916" class="body">TAA / FSR / DLSS-SR · ou DLSS Ray Reconstruction</text>
    <text x="1068" y="936" class="small">Pós-processamento ’ tonemap ’ swapchain</text>

    <path d="M430 776V824H405V862" class="flow-secondary"/>
    <path d="M870 776V814H405V862" class="flow-secondary"/>
    <path d="M1315 776V824H405V862" class="flow-secondary"/>
    <path d="M580 906H636" class="flow"/>
    <path d="M990 906H1046" class="flow"/>
  </g>

  <g aria-label="Legenda">
    <line x1="56" y1="1014" x2="96" y2="1014" class="flow"/>
    <text x="110" y="1018" class="small">fluxo principal</text>
    <line x1="238" y1="1014" x2="278" y2="1014" class="flow-history"/>
    <text x="292" y="1018" class="small">histórico / dependência</text>
    <text x="1544" y="1018" text-anchor="end" class="small">FPassRegistry coordena ciclo de vida; Renderer preserva a ordem explícita dos passes</text>
  </g>
</svg>
