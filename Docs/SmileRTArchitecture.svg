<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura geral de ray tracing da SmileEngine</title>
  <desc id="desc">Diagrama do fluxo DXR da SmileEngine, da cena e estruturas BLAS e TLAS aos passes DDGI, ReGIR, ReSTIR DI, ReSTIR GI, reflexos, NRD, DLSS Ray Reconstruction e composição HDR.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111d"/>
      <stop offset="0.55" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65d1ff" stop-opacity="0.22"/>
      <stop offset="0.52" stop-color="#a988ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07101c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rtCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14314a"/>
      <stop offset="1" stop-color="#13243a"/>
    </linearGradient>
    <linearGradient id="denoise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30264b"/>
      <stop offset="1" stop-color="#24223e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.34"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83cfff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#75869d"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #edf5ff; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2.2px; fill: #79d8ff; }
      .title { font-size: 34px; font-weight: 650; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #9fb1c7; }
      .section-number { font-size: 13px; font-weight: 700; fill: #65d1ff; letter-spacing: 1.4px; }
      .section-title { font-size: 17px; font-weight: 650; fill: #dceaff; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-title-small { font-size: 15px; font-weight: 650; }
      .body { font-size: 13px; fill: #c6d4e4; }
      .small { font-size: 11.5px; fill: #93a7be; }
      .chip { font-size: 11px; font-weight: 650; fill: #cdefff; letter-spacing: 0.45px; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; font-size: 11.5px; fill: #a8c8df; }
      .panel { fill: #101b2b; fill-opacity: 0.72; stroke: #26364a; stroke-width: 1; }
      .node { fill: #152337; stroke: #32465f; stroke-width: 1.2; }
      .node-cyan { fill: url(#rtCore); stroke: #3c7898; stroke-width: 1.2; }
      .node-purple { fill: url(#denoise); stroke: #6d5b9a; stroke-width: 1.2; }
      .node-green { fill: #16322f; stroke: #3e746b; stroke-width: 1.2; }
      .node-amber { fill: #352c1d; stroke: #7c6434; stroke-width: 1.2; }
      .mini { fill: #101c2c; stroke: #34506a; stroke-width: 1; }
      .divider { stroke: #2c4057; stroke-width: 1; }
      .flow { fill: none; stroke: #83cfff; stroke-width: 2; marker-end: url(#arrow); }
      .flow-muted { fill: none; stroke: #75869d; stroke-width: 1.5; marker-end: url(#arrowMuted); }
      .flow-dashed { fill: none; stroke: #70849b; stroke-width: 1.5; stroke-dasharray: 7 7; marker-end: url(#arrowMuted); }
      .bus-line { fill: none; stroke: #4f7795; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#bg)"/>
  <path d="M0 0H1800V108H0Z" fill="url(#headerGlow)"/>
  <path d="M0 107.5H1800" stroke="#263b52"/>

  <g aria-label="Cabeçalho">
    <text x="56" y="34" class="eyebrow">SMILEENGINE · RENDERER DX12</text>
    <text x="56" y="72" class="title">Arquitetura geral de Ray Tracing</text>
    <text x="1742" y="42" text-anchor="end" class="subtitle">DXR 1.1 · inline RayQuery · SM 6.5/6.6</text>
    <text x="1742" y="68" text-anchor="end" class="small">um Renderer por viewport · heap CBV/SRV/UAV compartilhado</text>
  </g>

  <!-- 1 · scene setup -->
  <g id="scene-setup" aria-label="Cena e estruturas de aceleração">
    <rect x="40" y="128" width="1720" height="218" rx="18" class="panel"/>
    <text x="64" y="156" class="section-number">01</text>
    <text x="100" y="156" class="section-title">Cena e estruturas de aceleração</text>

    <g filter="url(#shadow)">
      <rect x="64" y="178" width="270" height="132" rx="13" class="node"/>
      <rect x="84" y="194" width="86" height="22" rx="11" fill="#203b51"/>
      <text x="127" y="209" text-anchor="middle" class="chip">CPU / EDITOR</text>
      <text x="84" y="239" class="node-title">FScene</text>
      <text x="84" y="263" class="body">renderables · materiais · terreno</text>
      <text x="84" y="285" class="body">luzes locais · sol · câmera</text>

      <rect x="380" y="178" width="292" height="132" rx="13" class="node-cyan"/>
      <text x="402" y="212" class="node-title">FRaytracingScene</text>
      <text x="402" y="237" class="body">Build no carregamento da cena</text>
      <text x="402" y="259" class="body">rebuild leve da TLAS no frame</text>
      <text x="402" y="281" class="small">transform / visibilidade / flags RT</text>
    </g>

    <path d="M334 244H376" class="flow"/>

    <g aria-label="Mundo RT na GPU">
      <rect x="718" y="166" width="1018" height="156" rx="15" fill="#0f1d2d" stroke="#31516c" stroke-width="1.2"/>
      <text x="740" y="190" class="small">MUNDO RT NA GPU · recursos estáveis por cena</text>

      <rect x="742" y="207" width="212" height="90" rx="11" class="mini"/>
      <text x="760" y="236" class="node-title-small">BLAS pool compactado</text>
      <text x="760" y="258" class="body">uma BLAS por FGpuMesh única</text>
      <text x="760" y="278" class="mono">suballocado · alinhamento 256 B</text>

      <rect x="978" y="207" width="186" height="90" rx="11" class="mini"/>
      <text x="996" y="236" class="node-title-small">TLAS</text>
      <text x="996" y="258" class="body">instâncias visíveis</text>
      <text x="996" y="278" class="mono">mask · culling · InstanceID</text>

      <rect x="1188" y="207" width="270" height="90" rx="11" class="mini"/>
      <text x="1206" y="236" class="node-title-small">InstanceGeo + materiais</text>
      <text x="1206" y="258" class="body">snapshot compartilhado por todo RT</text>
      <text x="1206" y="278" class="mono">VB/IB bindless · alpha test</text>

      <rect x="1482" y="207" width="230" height="90" rx="11" class="mini"/>
      <text x="1500" y="236" class="node-title-small">Dados globais</text>
      <text x="1500" y="258" class="body">SkyView · luzes · BRDF LUT</text>
      <text x="1500" y="278" class="mono">descriptor tables por frame</text>
    </g>

    <path d="M672 220H738" class="flow"/>
    <path d="M672 244H696V196H1071V203" class="flow"/>
    <path d="M672 268H696V310H1323V301" class="flow"/>
    <path d="M954 252H974" class="flow-muted"/>
    <path d="M1164 252H1184" class="flow-muted"/>
  </g>

  <!-- 2 · per-frame shared infrastructure -->
  <g id="shared-frame" aria-label="Infraestrutura compartilhada por frame">
    <rect x="40" y="366" width="1720" height="236" rx="18" class="panel"/>
    <text x="64" y="394" class="section-number">02</text>
    <text x="100" y="394" class="section-title">Infraestrutura compartilhada por frame</text>

    <g filter="url(#shadow)">
      <rect x="64" y="420" width="314" height="142" rx="13" class="node"/>
      <text x="84" y="452" class="node-title">Geometry pass raster</text>
      <text x="84" y="477" class="body">G-buffer A/B/C · depth</text>
      <text x="84" y="499" class="body">velocity raster · material IDs</text>
      <line x1="84" y1="515" x2="356" y2="515" class="divider"/>
      <text x="84" y="540" class="small">superfície primária para os passes por pixel</text>

      <rect x="414" y="420" width="314" height="142" rx="13" class="node-cyan"/>
      <text x="434" y="452" class="node-title">Temporal Motion</text>
      <text x="434" y="477" class="body">surface history + transforms</text>
      <text x="434" y="499" class="body">motion vector dual e confiável</text>
      <line x1="434" y1="515" x2="706" y2="515" class="divider"/>
      <text x="434" y="540" class="small">ReSTIR / NRD reutilizam amostra ou radiância</text>

      <rect x="764" y="420" width="300" height="142" rx="13" class="node-green"/>
      <text x="784" y="452" class="node-title">ReGIR</text>
      <text x="784" y="477" class="body">reservoirs em grade de mundo</text>
      <text x="784" y="499" class="body">seleção de luz local no 2º hit</text>
      <line x1="784" y1="515" x2="1042" y2="515" class="divider"/>
      <text x="784" y="540" class="small">consumido por DDGI · GI · reflexos</text>

      <rect x="1100" y="404" width="636" height="174" rx="13" class="node-amber"/>
      <rect x="1122" y="421" width="73" height="22" rx="11" fill="#5d4a28"/>
      <text x="1158" y="436" text-anchor="middle" class="chip">CACHE GI</text>
      <text x="1122" y="471" class="node-title">DDGI · probe volume</text>
      <text x="1122" y="496" class="body">trace inline: 64 raios/probe → shading do hit → atualização temporal</text>
      <rect x="1122" y="516" width="174" height="38" rx="8" fill="#211f1a" stroke="#685530"/>
      <text x="1209" y="540" text-anchor="middle" class="small">Irradiance atlas</text>
      <rect x="1310" y="516" width="174" height="38" rx="8" fill="#211f1a" stroke="#685530"/>
      <text x="1397" y="540" text-anchor="middle" class="small">Distance moments</text>
      <rect x="1498" y="516" width="214" height="38" rx="8" fill="#211f1a" stroke="#685530"/>
      <text x="1605" y="540" text-anchor="middle" class="small">Probe data / relocation</text>
      <text x="1712" y="472" text-anchor="end" class="small">direct ou async compute</text>
    </g>

    <path d="M378 491H410" class="flow"/>
    <path d="M1071 297V385H571V416" class="flow-dashed"/>
    <path d="M1071 385H1418V400" class="flow-dashed"/>
    <path d="M1597 301V348H914V416" class="flow-dashed"/>
  </g>

  <!-- common inputs bus -->
  <g id="rt-bus" aria-label="Entradas e contratos comuns">
    <rect x="64" y="626" width="1672" height="74" rx="14" fill="#12263a" stroke="#3f6b88" stroke-width="1.3"/>
    <circle cx="92" cy="651" r="7" fill="#65d1ff" filter="url(#softGlow)"/>
    <text x="112" y="655" class="node-title-small">Conjunto de entradas dos passes inline RT</text>
    <text x="112" y="680" class="body">TLAS · InstanceGeo/material · VB/IB bindless · SkyView · luzes · G-buffer/depth · motion confiável · atlases DDGI · ReGIR</text>
    <text x="1712" y="655" text-anchor="end" class="small">cada passe consome seu subconjunto</text>
    <text x="1712" y="679" text-anchor="end" class="small">hits secundários: HitShading · ReGIR · DDGI</text>
    <path d="M221 562V622" class="flow-muted"/>
    <path d="M571 562V622" class="flow-muted"/>
    <path d="M914 562V622" class="flow-muted"/>
    <path d="M1418 578V622" class="flow-muted"/>
  </g>

  <!-- 3 · RT lighting paths -->
  <g id="rt-paths" aria-label="Caminhos de iluminação ray traced">
    <rect x="40" y="722" width="1720" height="238" rx="18" class="panel"/>
    <text x="64" y="750" class="section-number">03</text>
    <text x="100" y="750" class="section-title">Caminhos de iluminação RT por pixel</text>

    <path d="M316 700V778" class="flow"/>
    <path d="M900 700V778" class="flow"/>
    <path d="M1480 700V778" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="64" y="782" width="504" height="146" rx="14" class="node-cyan"/>
      <rect x="84" y="798" width="91" height="22" rx="11" fill="#24536d"/>
      <text x="130" y="813" text-anchor="middle" class="chip">DIRETA LOCAL</text>
      <text x="84" y="846" class="node-title">ReSTIR DI</text>
      <text x="84" y="871" class="body">candidatas → reservoir temporal → reuso espacial</text>
      <text x="84" y="893" class="body">até 1 shadow ray final · todas as luzes analíticas locais</text>
      <text x="84" y="915" class="small">independe do DDGI/ReGIR; o sol continua no deferred</text>

      <rect x="648" y="782" width="504" height="146" rx="14" class="node-green"/>
      <rect x="668" y="798" width="106" height="22" rx="11" fill="#28534c"/>
      <text x="721" y="813" text-anchor="middle" class="chip">INDIRETA DIFUSA</text>
      <text x="668" y="846" class="node-title">ReSTIR GI</text>
      <text x="668" y="871" class="body">final gather sobre o radiance cache DDGI</text>
      <text x="668" y="893" class="body">trace + temporal → spatial + visibilidade + resolve</text>
      <text x="668" y="915" class="small">reservoir x1/x2/n2/Lo/M/W em ping-pong</text>

      <rect x="1232" y="782" width="504" height="146" rx="14" class="node-purple"/>
      <rect x="1252" y="798" width="112" height="22" rx="11" fill="#50406f"/>
      <text x="1308" y="813" text-anchor="middle" class="chip">INDIRETA SPEC</text>
      <text x="1252" y="846" class="node-title">Reflexos RT</text>
      <text x="1252" y="871" class="body">trace inline em meia resolução → resolve</text>
      <text x="1252" y="893" class="body">shading do hit com DDGI + ReGIR + céu + luzes</text>
      <text x="1252" y="915" class="small">temporal + spatial interno, ou sinal cru para NRD / RR</text>
    </g>
  </g>

  <!-- 4 · denoise and composition -->
  <g id="output" aria-label="Denoise, composição e saída">
    <rect x="40" y="980" width="1720" height="214" rx="18" class="panel"/>
    <text x="64" y="1008" class="section-number">04</text>
    <text x="100" y="1008" class="section-title">Denoise, composição e saída</text>

    <g filter="url(#shadow)">
      <rect x="64" y="1034" width="620" height="126" rx="14" class="node-purple"/>
      <text x="86" y="1065" class="node-title">EDenoiser</text>
      <line x1="374" y1="1050" x2="374" y2="1144" class="divider"/>
      <text x="86" y="1092" class="node-title-small">NRD RELAX</text>
      <text x="86" y="1114" class="body">indireto: GI difuso + reflexo spec</text>
      <text x="86" y="1136" class="body">direto: instância RELAX dedicada</text>
      <text x="396" y="1092" class="node-title-small">None / bypass</text>
      <text x="396" y="1114" class="body">GI e DI crus</text>
      <text x="396" y="1136" class="body">reflexo usa temporal + spatial interno</text>

      <rect x="744" y="1034" width="422" height="126" rx="14" class="node-cyan"/>
      <text x="766" y="1065" class="node-title">Composição HDR</text>
      <text x="766" y="1092" class="body">Deferred: sol + DDGI ou ReSTIR GI</text>
      <text x="766" y="1114" class="body">+ direta local ReSTIR DI</text>
      <text x="766" y="1136" class="body">+ composite aditivo dos reflexos</text>

      <rect x="1226" y="1034" width="510" height="126" rx="14" class="node-green"/>
      <text x="1248" y="1065" class="node-title">Saída temporal / display</text>
      <text x="1248" y="1092" class="body">DLSS-RR: HDR cru + depth/MV + material guides</text>
      <text x="1248" y="1114" class="body">→ denoise neural + upscale em uma avaliação</text>
      <text x="1248" y="1136" class="small">ou TAA / FSR / DLSS-SR → pós-processamento → swapchain</text>
    </g>

    <path d="M316 928V956H208V1030" class="flow-muted"/>
    <path d="M900 928V956H342V1030" class="flow-muted"/>
    <path d="M1484 928V956H512V1030" class="flow-muted"/>
    <path d="M684 1097H740" class="flow"/>
    <path d="M1166 1097H1222" class="flow"/>
  </g>

  <g id="legend" aria-label="Legenda">
    <path d="M64 1217H112" class="flow"/>
    <text x="126" y="1221" class="small">fluxo principal de dados</text>
    <path d="M310 1217H358" class="flow-dashed"/>
    <text x="372" y="1221" class="small">dependência / atualização</text>
    <circle cx="588" cy="1217" r="5" fill="#65d1ff"/>
    <text x="602" y="1221" class="small">DXR requerido; subsistemas obedecem toggles e disponibilidade</text>
    <text x="1736" y="1221" text-anchor="end" class="small">2 frames in flight · históricos e tabelas em ping-pong quando aplicável</text>
  </g>
</svg>
