<svg viewBox="0 0 1000 776" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title>Referência visual — janela Sobre em QML</title>
  <desc>Migração do AboutDialog de QWidget para QML: uma página só no lugar das quatro abas, bloco de sistema com o que serve para reportar bug, licenças de terceiros em uma linha e chrome igual ao das outras janelas QML. Ao lado, o que saiu e o que entrou; embaixo, janela, bridge e passos da migração.</desc>

  <defs>
    <clipPath id="winClip"><rect x="100" y="70" width="560" height="470" rx="8"/></clipPath>
    <g id="mark">
      <circle cx="48" cy="48" r="34" fill="none" stroke="#d9a514" stroke-width="2.5" opacity="0.4"/>
      <path d="M69.24 21.44 A34 34 0 1 1 17.76 63.56 A34 34 0 0 0 69.24 21.44 Z" fill="#d9a514"/>
    </g>
  </defs>

  <rect width="1000" height="776" fill="#101110"/>

  <use href="#mark" transform="translate(32 16) scale(0.29)"/>
  <text x="66" y="32" font-size="13" fill="#e6e2d8">Sobre — migração para QML</text>
  <text x="66" y="46" font-size="10.5" fill="#e0885a">A janela foi REMOVIDA do editor — esta ref é o desenho de quando ela voltar</text>
  <text x="900" y="32" font-size="10.5" fill="#6c6a61" text-anchor="end">560 × 470 · não-modal</text>
  <text x="900" y="46" font-size="10.5" fill="#9a958a" text-anchor="end">Editor/Qml/AboutWindow.qml</text>

  <!-- ============ janela ============ -->
  <g clip-path="url(#winClip)">
    <rect x="100" y="70" width="560" height="470" fill="#141511"/>

    <!-- barra de titulo (48, igual StatsWindow) -->
    <use href="#mark" transform="translate(118 104) scale(0.1875)"/>
    <text x="142" y="99" font-size="14" font-weight="600" fill="#e6e2d8">Sobre</text>
    <g stroke="#9a958a" stroke-width="1.3" fill="none">
      <line x1="629" y1="89" x2="639" y2="99"/>
      <line x1="639" y1="89" x2="629" y2="99"/>
    </g>
    <line x1="100" y1="118" x2="660" y2="118" stroke="#23241d"/>

    <!-- identidade -->
    <use href="#mark" transform="translate(128 140) scale(0.75)"/>
    <text x="220" y="168" font-size="26" font-weight="600" fill="#e6e2d8">SmileEngine</text>
    <text x="221" y="188" font-size="11" fill="#d9a514">Real-Time 3D Engine</text>
    <text x="221" y="207" font-family="Consolas, monospace" font-size="10.5" fill="#9a958a">v3.0.0 · build 20260803</text>

    <text x="128" y="248" font-size="11.5" fill="#c8c2b4">Engine pessoal de renderização tempo-real em DirectX 12,</text>
    <text x="128" y="266" font-size="11.5" fill="#c8c2b4">com editor em Qt 6. C++20 · CMake · DXC.</text>

    <!-- card de sistema -->
    <rect x="128" y="288" width="504" height="184" rx="9" fill="#1a1b15" stroke="#2a2b24"/>
    <text x="146" y="312" font-size="12" font-weight="600" fill="#e6e2d8">Sistema</text>
    <rect x="536" y="298" width="80" height="22" rx="6" fill="#23241d" stroke="#33342c"/>
    <g stroke="#c8c2b4" stroke-width="1.1" fill="none">
      <rect x="549" y="305" width="7" height="9" rx="1.5"/>
      <path d="M552 303 h7 v9"/>
    </g>
    <text x="586" y="313" font-size="10.5" fill="#c8c2b4" text-anchor="middle">copiar</text>
    <line x1="128" y1="326" x2="632" y2="326" stroke="#23241d"/>

    <g font-size="11">
      <text x="146" y="348" fill="#6c6a61">GPU</text>
      <text x="252" y="348" font-family="Consolas, monospace" fill="#c8c2b4">NVIDIA GeForce RTX 3060 Ti · 8 GB</text>
      <text x="146" y="372" fill="#6c6a61">Recursos</text>
      <text x="252" y="372" font-family="Consolas, monospace" fill="#c8c2b4">DXR · FSR · DLSS · DLSS-RR</text>
      <text x="146" y="396" fill="#6c6a61">Sistema</text>
      <text x="252" y="396" font-family="Consolas, monospace" fill="#c8c2b4">Windows 11 Pro · x86_64</text>
      <text x="146" y="420" fill="#6c6a61">Qt</text>
      <text x="252" y="420" font-family="Consolas, monospace" fill="#c8c2b4">6.10.2</text>
      <text x="146" y="444" fill="#6c6a61">Compilador</text>
      <text x="252" y="444" font-family="Consolas, monospace" fill="#c8c2b4">MSVC 19.44</text>
      <text x="146" y="464" fill="#6c6a61">Build</text>
      <text x="252" y="464" font-family="Consolas, monospace" fill="#c8c2b4">2026-08-03 03:13 UTC</text>
    </g>

    <!-- rodape: terceiros + copyright -->
    <line x1="128" y1="492" x2="632" y2="492" stroke="#23241d"/>
    <text x="128" y="512" font-size="10" fill="#6c6a61">Qt 6 · <tspan fill="#5b9dff">LGPL v3</tspan></text>
    <text x="238" y="512" font-size="10" fill="#6c6a61">DirectX 12 · Microsoft</text>
    <text x="368" y="512" font-size="10" fill="#6c6a61">DXC · <tspan fill="#5b9dff">NCSA</tspan></text>
    <text x="632" y="512" font-size="10" fill="#6c6a61" text-anchor="end">© 2026 Kevin Ramos</text>
  </g>
  <rect x="100" y="70" width="560" height="470" rx="8" fill="none" stroke="#2e2f28"/>

  <text x="100" y="560" font-size="10.5" fill="#6c6a61">Uma página só: identidade, o que a engine é, o bloco que serve para reportar bug e os créditos obrigatórios. Nada de abas.</text>

  <!-- ============ diff ============ -->
  <rect x="690" y="70" width="210" height="228" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
  <text x="708" y="94" font-size="11" font-weight="600" fill="#e0885a">O QUE SAIU</text>
  <line x1="690" y1="104" x2="900" y2="104" stroke="#23241d"/>
  <g font-size="9.5" fill="#9a958a">
    <text x="708" y="124">As quatro abas</text>
    <text x="708" y="142">Créditos: autor, inspirações,</text>
    <text x="708" y="154">agradecimento à comunidade</text>
    <text x="708" y="172">Licença “proprietária</text>
    <text x="708" y="184">(placeholder — a definir)”</text>
    <text x="708" y="202">Versão e build repetidos</text>
    <text x="708" y="214">(já estão no cabeçalho)</text>
    <text x="708" y="232">Kernel do Windows</text>
    <text x="708" y="250">Qt de build (fica o de runtime)</text>
    <text x="708" y="268">Arquitetura em linha própria</text>
    <text x="708" y="286">Faixa dourada lateral e o .qss</text>
  </g>

  <rect x="690" y="312" width="210" height="150" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
  <text x="708" y="336" font-size="11" font-weight="600" fill="#9ac055">O QUE ENTROU</text>
  <line x1="690" y1="346" x2="900" y2="346" stroke="#23241d"/>
  <g font-size="9.5" fill="#c8c2b4">
    <text x="708" y="366">Recursos de RT e upscaler</text>
    <text x="708" y="384">VRAM junto da GPU</text>
    <text x="708" y="402">Licenças de terceiros em uma</text>
    <text x="708" y="414">linha, clicáveis</text>
    <text x="708" y="432">Chrome QML igual ao das</text>
    <text x="708" y="444">outras janelas (arrasta, fecha)</text>
  </g>

  <rect x="690" y="476" width="210" height="64" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
  <text x="708" y="500" font-size="11" font-weight="600" fill="#e6e2d8">Fica</text>
  <text x="708" y="518" font-size="9.5" fill="#9a958a">O botão de copiar: é o que</text>
  <text x="708" y="530" font-size="9.5" fill="#9a958a">transforma isto em anexo de bug.</text>

  <line x1="100" y1="584" x2="900" y2="584" stroke="#23241d"/>

  <!-- ============ specs ============ -->
  <g font-size="9.5">
    <rect x="100" y="600" width="246" height="140" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
    <text x="116" y="622" font-size="11" font-weight="600" fill="#e6e2d8">Janela</text>
    <line x1="100" y1="632" x2="346" y2="632" stroke="#23241d"/>
    <text x="116" y="650" fill="#c8c2b4">QDialog frameless + QQuickWidget —</text>
    <text x="116" y="663" fill="#c8c2b4">mesmo molde do Stats e do Time of Day</text>
    <text x="116" y="681" fill="#c8c2b4">560 × 470 fixo, não-modal</text>
    <text x="116" y="699" fill="#c8c2b4">WindowBridge: arrasta pela barra</text>
    <text x="116" y="712" fill="#c8c2b4">(startSystemMove) e fecha no ×</text>
    <text x="116" y="730" fill="#6c6a61">centraliza na 1ª abertura, como as outras</text>

    <rect x="376" y="600" width="248" height="140" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
    <text x="392" y="622" font-size="11" font-weight="600" fill="#e6e2d8">Bridge</text>
    <line x1="376" y1="632" x2="624" y2="632" stroke="#23241d"/>
    <text x="392" y="650" fill="#c8c2b4">AboutBridge (novo, ~80 linhas)</text>
    <text x="392" y="668" fill="#c8c2b4">props: version, build, gpu, vram,</text>
    <text x="392" y="681" fill="#c8c2b4">features, os, qt, compiler, buildDate</text>
    <text x="392" y="699" fill="#c8c2b4">slot: copyInfo() → clipboard</text>
    <text x="392" y="717" fill="#6c6a61">tudo lido uma vez; GPU e recursos vêm</text>
    <text x="392" y="730" fill="#6c6a61">do renderer quando ele já está pronto</text>

    <rect x="654" y="600" width="246" height="140" rx="8" fill="#1a1b15" stroke="#2a2b24"/>
    <text x="670" y="622" font-size="11" font-weight="600" fill="#e6e2d8">Migração</text>
    <line x1="654" y1="632" x2="900" y2="632" stroke="#23241d"/>
    <text x="670" y="650" fill="#9ac055">já feito: AboutDialog.h/.cpp, o .qss,</text>
    <text x="670" y="663" fill="#9ac055">o menu Ajuda e a MenuBridge saíram</text>
    <text x="670" y="681" fill="#c8c2b4">falta na volta: AboutWindow.qml,</text>
    <text x="670" y="694" fill="#c8c2b4">AboutBridge e o item de menu</text>
    <text x="670" y="712" fill="#6c6a61">logo vem de image://smilelogo, já registrado</text>
    <text x="670" y="730" fill="#6c6a61">git show do commit de remoção traz o antigo</text>
  </g>

  <text x="100" y="764" font-size="9" fill="#57564f">Depois disto o editor não tem mais nenhuma janela desenhada em QWidget — só o chrome nativo do QDialog hospedeiro.</text>
  <text x="900" y="764" font-size="9" fill="#57564f" text-anchor="end">Editor/Design/AboutWindow_Reference.svg</text>
</svg>
