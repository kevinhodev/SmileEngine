<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <title>SmileEngine — referência visual do console compacto</title>
  <desc>Console em formato de drawer baixo, com filtros de severidade, busca, ações compactas e linhas densas.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11130f"/>
      <stop offset="1" stop-color="#090a08"/>
    </linearGradient>
    <linearGradient id="viewportBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26363c"/>
      <stop offset="0.48" stop-color="#1b292d"/>
      <stop offset="1" stop-color="#101716"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11120f"/>
      <stop offset="1" stop-color="#0d0e0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#82968d" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="appClip"><rect x="20" y="56" width="1560" height="398" rx="12"/></clipPath>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
      .title { font-size: 18px; font-weight: 650; fill: #e6e2d8; }
      .subtitle { font-size: 11px; fill: #77786d; }
      .label { font-size: 11px; fill: #c8c2b4; }
      .small { font-size: 10px; fill: #9a958a; }
      .micro { font-size: 9px; fill: #6c6a61; }
      .cardTitle { font-size: 12px; font-weight: 650; fill: #e6e2d8; }
      .cardBody { font-size: 11px; fill: #969287; }
      .icon { fill: none; stroke: #a7a397; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .iconMuted { fill: none; stroke: #6c6a61; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .iconBlue { fill: none; stroke: #9ac055; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#pageBg)"/>
  <g class="ui">
    <text x="28" y="32" class="title">Console compacto</text>
    <rect x="190" y="14" width="110" height="23" rx="11.5" fill="#202b17" stroke="#4b672f"/>
    <circle cx="204" cy="25.5" r="3" fill="#9ac055"/>
    <text x="214" y="29" font-size="9.5" font-weight="650" letter-spacing=".8" fill="#b4da70">DRAWER V2</text>
    <text x="1572" y="29" text-anchor="end" class="subtitle">SmileEngine · Editor UI System</text>

    <!-- Recorte do editor para mostrar proporção real do drawer -->
    <g filter="url(#shadow)">
      <rect x="20" y="56" width="1560" height="398" rx="12" fill="#10110f" stroke="#30322a"/>
      <g clip-path="url(#appClip)">
        <!-- viewport ao fundo -->
        <rect x="20" y="56" width="1560" height="174" fill="url(#viewportBg)"/>
        <rect x="20" y="56" width="1560" height="34" fill="#131410"/>
        <path d="M20 89.5H1580" stroke="#292b24"/>
        <rect x="20" y="90" width="1560" height="140" fill="url(#grid)"/>
        <path d="M20 196c210-31 354-12 536 9 224 26 448-16 639-17 157-1 277 15 385 4v38H20z" fill="#13201e"/>
        <circle cx="1234" cy="160" r="55" fill="#354d50" stroke="#587276" stroke-opacity=".42"/>
        <ellipse cx="1214" cy="142" rx="20" ry="10" fill="#d9ffff" opacity=".08" transform="rotate(-25 1214 142)"/>
        <text x="34" y="77" class="small">Viewport</text>

        <!-- drawer do console -->
        <rect x="20" y="230" width="1560" height="203" fill="url(#panelBg)"/>
        <path d="M20 230.5H1580" stroke="#3a3c32"/>
        <path d="M20 261.5H1580" stroke="#24261f"/>

        <!-- command bar -->
        <g transform="translate(30 235)">
          <!-- terminal + titulo -->
          <rect width="21" height="21" rx="5" fill="#202b17" stroke="#4b672f"/>
          <path d="M6.2 7.2l3.1 3.2-3.1 3.2M11.2 14h4" class="iconBlue"/>
          <text x="30" y="15.5" font-size="11.5" font-weight="650" fill="#e6e2d8">Console</text>
          <path d="M88 2v17" stroke="#2a2c25"/>

          <!-- filtros -->
          <g transform="translate(99 0)">
            <rect width="47" height="21" rx="5" fill="#202b17" stroke="#4b672f"/>
            <text x="23.5" y="14.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b4da70">Todos</text>
          </g>
          <g transform="translate(151 0)">
            <rect width="49" height="21" rx="5" fill="#171914" stroke="#2b2d26"/>
            <circle cx="10" cy="10.5" r="2.6" fill="#7fa6ff"/>
            <text x="18" y="14.5" font-size="9.5" fill="#9a958a">Info</text>
          </g>
          <g transform="translate(205 0)">
            <rect width="60" height="21" rx="5" fill="#171914" stroke="#2b2d26"/>
            <circle cx="10" cy="10.5" r="2.6" fill="#e8b45f"/>
            <text x="18" y="14.5" font-size="9.5" fill="#9a958a">Avisos</text>
          </g>
          <g transform="translate(270 0)">
            <rect width="55" height="21" rx="5" fill="#171914" stroke="#2b2d26"/>
            <circle cx="10" cy="10.5" r="2.6" fill="#ef6961"/>
            <text x="18" y="14.5" font-size="9.5" fill="#9a958a">Erros</text>
          </g>

          <!-- busca -->
          <g transform="translate(1008 0)">
            <rect width="214" height="21" rx="5" fill="#0d0f0c" stroke="#2d2f28"/>
            <circle cx="12" cy="9" r="4" class="iconMuted"/>
            <path d="M15 12l3 3" class="iconMuted"/>
            <text x="25" y="14.5" font-size="9.5" fill="#6c6a61">Buscar nas mensagens</text>
            <rect x="180" y="3" width="27" height="15" rx="4" fill="#181a16" stroke="#292b24"/>
            <text x="193.5" y="13.4" text-anchor="middle" font-size="8" font-weight="600" fill="#77786d">Ctrl F</text>
          </g>

          <!-- contagem e ações -->
          <text x="1237" y="14.5" class="mono" font-size="9" fill="#6c6a61">12 / 500</text>
          <g transform="translate(1292 0)"><rect width="22" height="21" rx="5" fill="transparent"/><path d="M7 6h8M8 6v10h6V6M9 4h4" class="iconMuted"/></g>
          <g transform="translate(1318 0)"><rect width="22" height="21" rx="5" fill="#202b17"/><path d="M8 5h6l-1 5 3 2H6l3-2zM11 12v5" class="iconBlue"/></g>
          <g transform="translate(1344 0)"><rect width="22" height="21" rx="5" fill="transparent"/><circle cx="11" cy="6" r="1" fill="#8c887d"/><circle cx="11" cy="10.5" r="1" fill="#8c887d"/><circle cx="11" cy="15" r="1" fill="#8c887d"/></g>
          <g transform="translate(1370 0)"><rect width="22" height="21" rx="5" fill="transparent"/><path d="M7 7l4 4 4-4" class="iconMuted"/></g>
        </g>

        <!-- log rows -->
        <g class="mono">
          <rect x="27" y="268" width="1544" height="22" rx="3" fill="#151713"/>
          <rect x="27" y="268" width="2" height="22" rx="1" fill="#7fa6ff"/>
          <text x="39" y="282.5" font-size="10" fill="#65665e">20:08:59.047</text>
          <text x="126" y="282.5" font-size="9" font-weight="700" fill="#829ff2">INFO</text>
          <text x="172" y="282.5" font-size="10.5" fill="#c4c0b5">Cena carregada em 418 ms: courtyard.sscene · 24 meshes, 31 materiais, 24 renderáveis, 82 texturas</text>

          <rect x="27" y="290" width="1544" height="22" rx="3" fill="#0f100e"/>
          <rect x="27" y="290" width="2" height="22" rx="1" fill="#7fa6ff"/>
          <text x="39" y="304.5" font-size="10" fill="#65665e">20:08:59.223</text>
          <text x="126" y="304.5" font-size="9" font-weight="700" fill="#829ff2">INFO</text>
          <text x="172" y="304.5" font-size="10.5" fill="#c4c0b5">Renderer pronto em 7426 ms · 1573×768 · DXR · FSR · DLSS · DLSS-RR</text>

          <rect x="27" y="312" width="1544" height="22" rx="3" fill="#151713"/>
          <rect x="27" y="312" width="2" height="22" rx="1" fill="#e8b45f"/>
          <text x="39" y="326.5" font-size="10" fill="#65665e">20:09:12.606</text>
          <text x="126" y="326.5" font-size="9" font-weight="700" fill="#e8b45f">WARN</text>
          <text x="172" y="326.5" font-size="10.5" fill="#d2c7ad">VRAM acima do budget do sistema: 7312 MiB / 7168 MiB</text>

          <rect x="27" y="334" width="1544" height="22" rx="3" fill="#0f100e"/>
          <rect x="27" y="334" width="2" height="22" rx="1" fill="#ef6961"/>
          <text x="39" y="348.5" font-size="10" fill="#65665e">20:09:15.018</text>
          <text x="126" y="348.5" font-size="9" font-weight="700" fill="#ef6961">ERR</text>
          <text x="172" y="348.5" font-size="10.5" fill="#e4b6b1">Falha ao recompilar WaterSurface.ps.hlsl — mantendo o último shader válido</text>

          <rect x="27" y="356" width="1544" height="22" rx="3" fill="#151713"/>
          <rect x="27" y="356" width="2" height="22" rx="1" fill="#7fa6ff"/>
          <text x="39" y="370.5" font-size="10" fill="#65665e">20:09:18.401</text>
          <text x="126" y="370.5" font-size="9" font-weight="700" fill="#829ff2">INFO</text>
          <text x="172" y="370.5" font-size="10.5" fill="#c4c0b5">Shader recompilado: VolumetricClouds.cs.hlsl · 183 ms</text>

          <rect x="27" y="378" width="1544" height="22" rx="3" fill="#0f100e"/>
          <rect x="27" y="378" width="2" height="22" rx="1" fill="#7fa6ff"/>
          <text x="39" y="392.5" font-size="10" fill="#65665e">20:09:24.774</text>
          <text x="126" y="392.5" font-size="9" font-weight="700" fill="#829ff2">INFO</text>
          <text x="172" y="392.5" font-size="10.5" fill="#c4c0b5">Ambiente HDR carregado: studio_small_09_4k.hdr</text>
        </g>

        <!-- scrollbar mínima -->
        <rect x="1564" y="270" width="4" height="126" rx="2" fill="#1e201b"/>
        <rect x="1564" y="290" width="4" height="48" rx="2" fill="#555a52"/>

        <!-- status bar do editor, separado do console -->
        <rect x="20" y="410" width="1560" height="23" fill="#12130f"/>
        <path d="M20 409.5H1580" stroke="#292b24"/>
        <circle cx="34" cy="421.5" r="3" fill="#8fb05c"/>
        <text x="44" y="425" font-size="9.5" fill="#8d897f">Pronto</text>
        <text x="1563" y="425" text-anchor="end" class="mono" font-size="9.5" fill="#8d897f">FPS 144,0   ·   Frame 6,94 ms   ·   meshes 24</text>
      </g>
    </g>

    <!-- Linha de dimensões -->
    <path d="M20 478v12M20 484h1560M1580 478v12" stroke="#3b3d34"/>
    <text x="800" y="481" text-anchor="middle" font-size="9" fill="#66685e">DRAWER REDIMENSIONÁVEL · ABERTURA RECOMENDADA 124 px</text>

    <!-- cards explicativos -->
    <g transform="translate(20 516)">
      <rect width="500" height="158" rx="10" fill="#151712" stroke="#2b2d26"/>
      <circle cx="28" cy="29" r="13" fill="#202b17" stroke="#4b672f"/>
      <text x="28" y="33" text-anchor="middle" font-size="10" font-weight="700" fill="#b4da70">01</text>
      <text x="50" y="33" class="cardTitle">Uma faixa, uma hierarquia</text>
      <text x="20" y="62" class="cardBody">Título, filtros, busca e ações dividem a mesma linha de 30 px.</text>
      <text x="20" y="80" class="cardBody">O console deixa de parecer uma janela e vira uma ferramenta auxiliar.</text>
      <rect x="20" y="104" width="460" height="34" rx="6" fill="#10110e" stroke="#282a23"/>
      <rect x="30" y="111" width="58" height="20" rx="5" fill="#202b17" stroke="#4b672f"/>
      <rect x="95" y="111" width="58" height="20" rx="5" fill="#171914" stroke="#292b24"/>
      <rect x="160" y="111" width="58" height="20" rx="5" fill="#171914" stroke="#292b24"/>
      <path d="M231 109v24" stroke="#292b24"/>
      <rect x="247" y="111" width="174" height="20" rx="5" fill="#0c0d0b" stroke="#292b24"/>
      <circle cx="448" cy="121" r="8" fill="#202b17"/>
    </g>

    <g transform="translate(540 516)">
      <rect width="500" height="158" rx="10" fill="#151712" stroke="#2b2d26"/>
      <circle cx="28" cy="29" r="13" fill="#2e2717" stroke="#5b4925"/>
      <text x="28" y="33" text-anchor="middle" font-size="10" font-weight="700" fill="#e8bd68">02</text>
      <text x="50" y="33" class="cardTitle">Severidade que se lê em um relance</text>
      <text x="20" y="62" class="cardBody">Barra lateral, tag curta e cor trabalham juntas sem colorir a frase.</text>
      <text x="20" y="80" class="cardBody">A mensagem continua neutra; somente o que exige atenção ganha peso.</text>
      <g class="mono" transform="translate(20 101)">
        <rect width="460" height="23" rx="4" fill="#10110e"/>
        <rect width="2" height="23" rx="1" fill="#e8b45f"/>
        <text x="13" y="15.5" font-size="9" fill="#65665e">20:09:12.606</text>
        <text x="99" y="15.5" font-size="9" font-weight="700" fill="#e8b45f">WARN</text>
        <text x="145" y="15.5" font-size="9.5" fill="#d2c7ad">VRAM acima do budget do sistema</text>
      </g>
      <text x="20" y="145" class="micro">COR É SINAL, NÃO DECORAÇÃO</text>
    </g>

    <g transform="translate(1060 516)">
      <rect width="520" height="158" rx="10" fill="#151712" stroke="#2b2d26"/>
      <circle cx="28" cy="29" r="13" fill="#1f2d1b" stroke="#3f5933"/>
      <text x="28" y="33" text-anchor="middle" font-size="10" font-weight="700" fill="#9ac055">03</text>
      <text x="50" y="33" class="cardTitle">Densidade de engine</text>
      <text x="20" y="62" class="cardBody">Linhas únicas de 22 px preservam contexto e exibem mais eventos.</text>
      <text x="20" y="80" class="cardBody">Busca, filtro e follow continuam acessíveis mesmo com o drawer baixo.</text>
      <g transform="translate(20 103)">
        <rect width="34" height="34" rx="7" fill="#11130f" stroke="#2b2d26"/>
        <text x="17" y="21" text-anchor="middle" font-size="9" font-weight="700" fill="#9ac055">22</text>
        <text x="45" y="14" class="small">px por evento</text>
        <text x="45" y="29" class="micro">SEM QUEBRA DE LINHA · ELIDE NO FINAL</text>
      </g>
    </g>
  </g>
</svg>
