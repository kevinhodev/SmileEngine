  <!-- ================= recomendação ================= -->
  <circle cx="106" cy="1017" r="3.5" fill="#d9a514"/>
  <text x="118" y="1021" font-size="10" fill="#c8c2b4"><tspan fill="#e6e2d8" font-weight="600">Recomendo a 1 (Esfera).</tspan> É a única que fala do produto (limbo iluminado = render), sobrevive em 16 px e em uma cor, e não é o cubo genérico do mercado. A 4 é o plano B se você quiser manter a marca atual.</text>
  <text x="118" y="1036" font-size="9" fill="#6c6a61">No código: <tspan font-family="Consolas, monospace">MakeSmileLogoPixmap</tspan> cai para ~12 linhas (um círculo + um crescente de dois arcos, cor chapada) — some a sombra de 16 px e o gradiente de 4 paradas; ícone da janela, About e splash herdam sozinhos.</text>
