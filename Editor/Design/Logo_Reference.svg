          <path d="M78 18 L43 18 C24 18 14 31 18 45 C20.5 54 30 58 43 58 L58 58 C73 58 79 68 70 77 C61 86 39 83 18 70"/>
          <path d="M42 39 L72 39"/>
        </g>
        <g stroke="#000" stroke-opacity="0.53" stroke-width="5.8" transform="translate(0 1.5)">
          <path d="M48 66.5 A6 6.5 0 0 0 36 66.5"/><path d="M67 66.5 A6 6.5 0 0 0 55 66.5"/>
        </g>
        <g stroke="#ffd527" stroke-width="4.2">
          <path d="M48 66.5 A6 6.5 0 0 0 36 66.5"/><path d="M67 66.5 A6 6.5 0 0 0 55 66.5"/>
        </g>
      </g>
    </g>

    <!-- ===== 1 · esfera (terminador) ===== -->
    <g id="mk1">
      <circle cx="48" cy="48" r="34" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.4"/>
      <path d="M69.24 21.44 A34 34 0 1 1 17.76 63.56 A34 34 0 0 0 69.24 21.44 Z" fill="currentColor"/>
    </g>

