      <path d="M48 14 L78 31 L78 63 L48 80 L18 63 L18 31 Z" stroke-width="4.5"/>
      <path d="M18 31 L48 48 L78 31 M48 48 L48 80" stroke-width="2.6" opacity="0.42"/>
      <path d="M29 53 Q48 71 67 53" stroke-width="7"/>
    </g>

