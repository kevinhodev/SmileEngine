  <text x="248" y="214" font-size="8" fill="#6c6a61" text-anchor="middle">32</text>
  <text x="284" y="214" font-size="8" fill="#6c6a61" text-anchor="middle">16</text>

  <line x1="310" y1="104" x2="310" y2="204" stroke="#2a2b24"/>
  <g font-size="9.5" fill="#c8c2b4">
    <text x="332" y="118">Quatro elementos disputando 96 px: fita S + barra central + dois arcos. Abaixo de 32 px vira borrão.</text>
    <text x="332" y="136">Três espessuras (12 / 4,2 / 2) e uma sombra preta de 16 px — a sombra faz o contraste que devia vir da forma.</text>
    <text x="332" y="154">Gradiente de quatro paradas: some no ícone pequeno e briga com a arte da splash.</text>
    <text x="332" y="172">Terminais misturam corte reto e ponta redonda; a curva de baixo é assimétrica sem intenção.</text>
    <text x="332" y="190" fill="#d98a8a">Não sobrevive em uma cor: sem gradiente e sem sombra as partes colam umas nas outras.</text>
  </g>

  <line x1="100" y1="240" x2="900" y2="240" stroke="#23241d"/>

  <!-- ================= direções ================= -->
