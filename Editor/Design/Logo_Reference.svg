  <!-- ================= cabeçalho ================= -->
  <g color="#d9a514"><use href="#mk1" transform="translate(32 16) scale(0.29)"/></g>
  <text x="66" y="32" font-size="13" fill="#e6e2d8">Marca — SmileEngine</text>
  <text x="66" y="46" font-size="10.5" fill="#6c6a61">Quatro direções de redesenho · cada uma testada em 96, 32 e 16 px, em uma cor e no badge do app</text>
  <text x="900" y="32" font-size="10.5" fill="#6c6a61" text-anchor="end">referência visual · escolher uma antes de codar</text>
  <text x="900" y="46" font-size="10.5" fill="#9a958a" text-anchor="end">Editor/Source/SmileLogo.cpp</text>

