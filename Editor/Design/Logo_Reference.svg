<svg viewBox="0 0 1000 1046" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title>Referência visual — redesenho da marca do SmileEngine</title>
  <desc>Diagnóstico da marca atual e quatro direções de redesenho, cada uma testada em 96, 32 e 16 px, em uma cor e dentro do badge de ícone do app. Fecha com os lockups da direção recomendada, aplicação em barra de título, splash e About, e a nota de implementação no MakeSmileLogoPixmap.</desc>

  <defs>
    <linearGradient id="oldGold" x1="0" y1="14" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffeb62"/>
      <stop offset="0.32" stop-color="#ffc218"/>
      <stop offset="0.68" stop-color="#e69700"/>
      <stop offset="1" stop-color="#ffd334"/>
    </linearGradient>
    <radialGradient id="oldGlow">
      <stop offset="0" stop-color="#ffbf18" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb400" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== marca de hoje (paths reais do MakeSmileLogoPixmap) ===== -->
    <g id="mkToday">
      <circle cx="48" cy="47" r="46" fill="url(#oldGlow)"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#000" stroke-opacity="0.67" stroke-width="16">
          <path d="M78 18 L43 18 C24 18 14 31 18 45 C20.5 54 30 58 43 58 L58 58 C73 58 79 68 70 77 C61 86 39 83 18 70"/>
