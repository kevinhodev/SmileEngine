  <text x="100" y="78" font-size="10" fill="#9a958a" letter-spacing="1.4">O QUE EXISTE HOJE</text>
  <rect x="100" y="88" width="800" height="132" rx="8" fill="#1a1b15" stroke="#2a2b24"/>

  <use href="#mkToday" transform="translate(120 104) scale(1)"/>
  <use href="#mkToday" transform="translate(232 138) scale(0.3333)"/>
  <use href="#mkToday" transform="translate(276 146) scale(0.1667)"/>
