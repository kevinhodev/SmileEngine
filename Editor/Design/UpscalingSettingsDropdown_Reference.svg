<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="Segoe UI, Inter, system-ui, sans-serif">
  <title>SmileEngine — referência do seletor de upscaling</title>
  <desc>Conceito da página de Renderização com dropdown para Sem upscaling, FSR, DLSS e XeSS, presets de qualidade e resumo de resolução.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#050605" flood-opacity=".55"/>
    </filter>
    <filter id="menuShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050605" flood-opacity=".72"/>
    </filter>
    <linearGradient id="selected" x1="0" x2="1">
      <stop offset="0" stop-color="#17294a"/>
      <stop offset="1" stop-color="#142039"/>
    </linearGradient>
    <linearGradient id="windowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11130f"/>
      <stop offset="1" stop-color="#0d0f0c"/>
    </linearGradient>
    <style>
      .primary { fill:#e8e5dc; }
      .normal { fill:#c9c5ba; }
      .secondary { fill:#989489; }
      .muted { fill:#676a60; }
      .blue { fill:#63a2ff; }
      .green { fill:#9bc55a; }
      .amber { fill:#d4a44f; }
      .label { font-size:12px; font-weight:500; }
      .small { font-size:11px; }
      .tiny { font-size:10px; }
      .method { font-size:13px; font-weight:500; }
    </style>
  </defs>

  <!-- Window -->
  <rect x="20" y="20" width="1160" height="720" rx="14" fill="url(#windowBg)"
        stroke="#30332b" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1160" height="46" rx="14" fill="#151713"/>
  <rect x="20" y="52" width="1160" height="14" fill="#151713"/>
  <line x1="20" y1="66" x2="1180" y2="66" stroke="#282b24"/>

  <!-- Title bar -->
  <g transform="translate(38 35)">
    <circle cx="9" cy="8" r="8" fill="none" stroke="#63a2ff" stroke-width="1.4"/>
    <circle cx="6" cy="6" r="1.1" fill="#63a2ff"/>
    <circle cx="12" cy="6" r="1.1" fill="#63a2ff"/>
    <path d="M5 10 Q9 14 13 10" fill="none" stroke="#63a2ff" stroke-width="1.2"/>
  </g>
  <text x="66" y="49" font-size="12" class="normal">Configurações — SmileEngine</text>
  <g stroke="#8a897f" stroke-width="1.3" fill="none">
    <line x1="1090" y1="43" x2="1101" y2="43"/>
    <rect x="1121" y="38" width="10" height="10" rx="1.5"/>
    <path d="M1152 38 l10 10 M1162 38 l-10 10"/>
  </g>

  <!-- Sidebar -->
  <rect x="20" y="66" width="226" height="674" fill="#0d0f0c"/>
  <line x1="246" y1="66" x2="246" y2="740" stroke="#282b24"/>
  <rect x="38" y="88" width="190" height="34" rx="7" fill="#171914" stroke="#292c25"/>
  <circle cx="53" cy="104" r="5" fill="none" stroke="#676a60" stroke-width="1.2"/>
  <line x1="57" y1="108" x2="61" y2="112" stroke="#676a60" stroke-width="1.2"/>
  <text x="70" y="109" class="small muted">Buscar configuração…</text>

  <text x="42" y="154" class="tiny muted">GRÁFICOS</text>
  <rect x="34" y="168" width="198" height="38" rx="8" fill="#17233b" stroke="#29446f"/>
  <rect x="34" y="174" width="3" height="26" rx="1.5" fill="#63a2ff"/>
  <rect x="49" y="179" width="14" height="10" rx="1.5" fill="none" stroke="#63a2ff" stroke-width="1.3"/>
  <line x1="56" y1="189" x2="56" y2="193" stroke="#63a2ff" stroke-width="1.3"/>
  <line x1="52" y1="193" x2="60" y2="193" stroke="#63a2ff" stroke-width="1.3"/>
  <text x="74" y="192" font-size="12" class="primary">Renderização</text>

  <g class="normal" font-size="12">
    <text x="74" y="237">Iluminação global</text>
    <text x="74" y="277">Reflexos e denoise</text>
    <text x="74" y="317">Sombras e céu</text>
    <text x="74" y="357">Pós-processo</text>
  </g>
  <g fill="none" stroke="#85867d" stroke-width="1.3">
    <circle cx="56" cy="232" r="6"/>
    <path d="M50 272 h12 l-2 10 h-8 z"/>
    <path d="M50 312 q6 -8 12 0 q-6 8 -12 0"/>
    <line x1="49" y1="351" x2="63" y2="351"/>
    <line x1="49" y1="359" x2="63" y2="359"/>
    <circle cx="54" cy="351" r="2" fill="#0d0f0c"/>
    <circle cx="59" cy="359" r="2" fill="#0d0f0c"/>
  </g>

  <text x="42" y="410" class="tiny muted">EDITOR</text>
  <g class="normal" font-size="12">
    <text x="74" y="449">Interface</text>
    <text x="74" y="489">Atalhos</text>
    <text x="74" y="529">Projeto</text>
  </g>
  <g fill="none" stroke="#85867d" stroke-width="1.3">
    <rect x="49" y="437" width="14" height="12" rx="2"/>
    <path d="M49 480 h14 v10 h-14 z M53 486 h6"/>
    <path d="M49 518 h6 l2 3 h7 v10 h-15 z"/>
  </g>

  <rect x="38" y="662" width="190" height="54" rx="9" fill="#171914" stroke="#292c25"/>
  <text x="52" y="683" class="tiny muted">RENDERER</text>
  <circle cx="54" cy="699" r="3" fill="#9bc55a"/>
  <text x="64" y="703" class="small normal">DX12 · RTX disponível</text>

  <!-- Main heading -->
  <text x="278" y="106" font-size="22" font-weight="500" class="primary">Renderização</text>
  <text x="278" y="125" class="small secondary">Reconstrução, anti-aliasing e resolução interna do viewport</text>
  <rect x="835" y="91" width="86" height="22" rx="11" fill="#1b2118" stroke="#35432b"/>
  <circle cx="851" cy="102" r="3" fill="#9bc55a"/>
  <text x="862" y="106" class="tiny green">CONCEITO</text>

  <!-- Main card -->
  <rect x="278" y="146" width="643" height="570" rx="11" fill="#171914" stroke="#30332b"/>
  <text x="306" y="178" font-size="14" font-weight="500" class="primary">Upscaling e anti-aliasing</text>
  <text x="306" y="197" class="small muted">Escolha a tecnologia; a engine mostra apenas opções compatíveis com a GPU.</text>
  <line x1="278" y1="214" x2="921" y2="214" stroke="#282b24"/>

  <!-- Technology dropdown field -->
  <text x="306" y="242" class="label normal">Tecnologia de reconstrução</text>
  <rect x="306" y="252" width="587" height="48" rx="8" fill="#20231c" stroke="#42679d" stroke-width="1.2"/>
  <rect x="318" y="262" width="30" height="28" rx="7" fill="#282d24"/>
  <path d="M327 282 l6 -12 l6 12 z" fill="none" stroke="#e8e5dc" stroke-width="1.3"/>
  <text x="360" y="274" class="method primary">AMD FidelityFX Super Resolution</text>
  <text x="360" y="289" class="tiny secondary">FSR 3.1 · temporal · compatível com esta GPU</text>
  <rect x="748" y="265" width="94" height="22" rx="11" fill="#1d3424" stroke="#35563c"/>
  <circle cx="762" cy="276" r="3" fill="#9bc55a"/>
  <text x="772" y="280" class="tiny green">DISPONÍVEL</text>
  <path d="M865 271 l8 8 l8 -8" fill="none" stroke="#b7b4aa" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open dropdown menu -->
  <g filter="url(#menuShadow)">
    <rect x="306" y="306" width="587" height="200" rx="9" fill="#20231c" stroke="#3a3d34"/>

    <rect x="312" y="312" width="575" height="44" rx="7" fill="transparent"/>
    <rect x="324" y="320" width="28" height="28" rx="7" fill="#292c25"/>
    <text x="338" y="339" text-anchor="middle" class="small normal">1:1</text>
    <text x="365" y="331" class="method normal">Sem upscaling</text>
    <text x="365" y="346" class="tiny muted">TAA · escala manual de 100% a 200% (SSAA)</text>
    <text x="866" y="338" text-anchor="end" class="tiny secondary">SEMPRE</text>

    <rect x="312" y="358" width="575" height="44" rx="7" fill="url(#selected)" stroke="#315991"/>
    <rect x="324" y="366" width="28" height="28" rx="7" fill="#233654"/>
    <path d="M332 387 l6 -13 l6 13 z" fill="none" stroke="#63a2ff" stroke-width="1.3"/>
    <text x="365" y="377" class="method primary">AMD FidelityFX Super Resolution</text>
    <text x="365" y="392" class="tiny secondary">FSR 3.1 · melhor compatibilidade e desempenho</text>
    <circle cx="771" cy="380" r="3" fill="#9bc55a"/>
    <text x="781" y="384" class="tiny green">RECOMENDADO</text>
    <path d="M862 377 l4 4 l8 -9" fill="none" stroke="#63a2ff" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="312" y="404" width="575" height="44" rx="7" fill="transparent"/>
    <rect x="324" y="412" width="28" height="28" rx="7" fill="#292c25"/>
    <text x="338" y="431" text-anchor="middle" font-size="9" font-weight="600" fill="#92bdff">DL</text>
    <text x="365" y="423" class="method normal">NVIDIA DLSS Super Resolution</text>
    <text x="365" y="438" class="tiny muted">Modelo transformer · requer GPU GeForce RTX</text>
    <rect x="805" y="416" width="65" height="20" rx="10" fill="#1d3424" stroke="#35563c"/>
    <text x="837" y="430" text-anchor="middle" class="tiny green">RTX OK</text>

    <rect x="312" y="450" width="575" height="44" rx="7" fill="transparent"/>
    <rect x="324" y="458" width="28" height="28" rx="7" fill="#292c25"/>
    <text x="338" y="477" text-anchor="middle" font-size="9" font-weight="600" fill="#a9c9ff">Xe</text>
    <text x="365" y="469" class="method normal">Intel XeSS Super Resolution</text>
    <text x="365" y="484" class="tiny muted">Alternativa ML · caminho DP4a nesta GPU</text>
    <rect x="795" y="462" width="75" height="20" rx="10" fill="#24271f" stroke="#3a3d34"/>
    <text x="832" y="476" text-anchor="middle" class="tiny secondary">OPCIONAL</text>
  </g>

  <!-- Quality presets -->
  <text x="306" y="535" class="label normal">Preset de qualidade</text>
  <text x="893" y="535" text-anchor="end" class="tiny muted">FSR controla a escala interna</text>
  <rect x="306" y="546" width="587" height="38" rx="8" fill="#20231c" stroke="#30332b"/>
  <rect x="424" y="548" width="116" height="34" rx="7" fill="#17294a" stroke="#315991"/>
  <text x="365" y="570" text-anchor="middle" class="small secondary">100%</text>
  <text x="482" y="570" text-anchor="middle" class="small blue">Qualidade</text>
  <text x="599" y="570" text-anchor="middle" class="small secondary">Balanceado</text>
  <text x="716" y="570" text-anchor="middle" class="small secondary">Performance</text>
  <text x="834" y="570" text-anchor="middle" class="small secondary">Ultra</text>

  <!-- Resolution summary -->
  <rect x="306" y="600" width="587" height="64" rx="9" fill="#141a17" stroke="#29352d"/>
  <circle cx="326" cy="620" r="4" fill="#9bc55a"/>
  <text x="340" y="624" class="small normal">Reconstrução ativa</text>
  <text x="340" y="644" class="small secondary">Render interno</text>
  <text x="433" y="644" class="small primary">1279 × 621</text>
  <path d="M518 640 h28 M540 635 l6 5 l-6 5" fill="none" stroke="#676a60" stroke-width="1.3"/>
  <text x="564" y="644" class="small secondary">Saída</text>
  <text x="604" y="644" class="small primary">1918 × 931</text>
  <rect x="783" y="619" width="91" height="24" rx="12" fill="#1b2b21" stroke="#34483a"/>
  <text x="828" y="635" text-anchor="middle" class="tiny green">−55% PIXELS</text>

  <!-- Footer row -->
  <path d="M310 687 h8 l4 4 l-4 4 h-8 z" fill="none" stroke="#676a60" stroke-width="1.2"/>
  <text x="330" y="695" class="small muted">Opções avançadas</text>
  <text x="893" y="695" text-anchor="end" class="small blue">Restaurar recomendado: FSR 3.1</text>

  <!-- Right status cards -->
  <rect x="941" y="146" width="211" height="232" rx="11" fill="#171914" stroke="#30332b"/>
  <text x="961" y="178" font-size="13" font-weight="500" class="primary">Resumo atual</text>
  <line x1="941" y1="194" x2="1152" y2="194" stroke="#282b24"/>
  <text x="961" y="222" class="small muted">Tecnologia</text>
  <text x="1132" y="222" text-anchor="end" class="small normal">FSR 3.1</text>
  <text x="961" y="250" class="small muted">Preset</text>
  <text x="1132" y="250" text-anchor="end" class="small blue">Qualidade</text>
  <text x="961" y="278" class="small muted">Escala</text>
  <text x="1132" y="278" text-anchor="end" class="small normal">66,7%</text>
  <text x="961" y="306" class="small muted">Anti-aliasing</text>
  <text x="1132" y="306" text-anchor="end" class="small normal">Temporal</text>
  <line x1="961" y1="326" x2="1132" y2="326" stroke="#282b24"/>
  <circle cx="966" cy="350" r="4" fill="#9bc55a"/>
  <text x="979" y="354" class="small green">Configuração válida</text>

  <rect x="941" y="394" width="211" height="220" rx="11" fill="#171914" stroke="#30332b"/>
  <text x="961" y="426" font-size="13" font-weight="500" class="primary">Por que assim?</text>
  <line x1="941" y1="442" x2="1152" y2="442" stroke="#282b24"/>
  <circle cx="965" cy="468" r="10" fill="#17294a"/>
  <text x="965" y="472" text-anchor="middle" class="tiny blue">1</text>
  <text x="984" y="465" class="small normal">Um único seletor</text>
  <text x="984" y="480" class="tiny muted">escala para novos backends.</text>
  <circle cx="965" cy="510" r="10" fill="#17294a"/>
  <text x="965" y="514" text-anchor="middle" class="tiny blue">2</text>
  <text x="984" y="507" class="small normal">Presets continuam rápidos</text>
  <text x="984" y="522" class="tiny muted">um clique para comparar.</text>
  <circle cx="965" cy="552" r="10" fill="#17294a"/>
  <text x="965" y="556" text-anchor="middle" class="tiny blue">3</text>
  <text x="984" y="549" class="small normal">Sem controles conflitantes</text>
  <text x="984" y="564" class="tiny muted">SSAA fica em Sem upscaling.</text>
  <rect x="961" y="582" width="171" height="1" fill="#282b24"/>
  <text x="961" y="602" class="tiny muted">Dropdown mostrado aberto para</text>
  <text x="961" y="616" class="tiny muted">documentar estados e hierarquia.</text>

  <!-- Bottom note -->
  <rect x="941" y="632" width="211" height="84" rx="11" fill="#141a17" stroke="#29352d"/>
  <text x="961" y="658" class="tiny green">COMPORTAMENTO</text>
  <text x="961" y="678" class="small normal">O padrão segue o backend</text>
  <text x="961" y="694" class="small normal">recomendado para a GPU atual;</text>
  <text x="961" y="710" class="small normal">nesta referência, FSR 3.1.</text>
</svg>
