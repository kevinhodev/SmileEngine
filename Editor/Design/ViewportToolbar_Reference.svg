<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <title>SmileEngine — referência visual da toolbar do viewport</title>
  <desc>Proposta de toolbar compacta e funcional com criação, histórico, modos de transformação, espaço global ou local, snapping, câmera, visualização, filtros, velocidade, estatísticas, grade e maximização.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11130f"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </linearGradient>
    <linearGradient id="viewportBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b282b"/>
      <stop offset="0.55" stop-color="#121b1d"/>
      <stop offset="1" stop-color="#0c0f0e"/>
    </linearGradient>
    <linearGradient id="activeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26351a"/>
      <stop offset="1" stop-color="#1c2815"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20221c" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#171914" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#7ea6a8"/>
      <stop offset="0.4" stop-color="#405d5e"/>
      <stop offset="0.78" stop-color="#1b2b2c"/>
      <stop offset="1" stop-color="#0d1212"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c958d" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 650; fill: #e6e2d8; }
      .subtitle { font-size: 11px; fill: #77786d; letter-spacing: .15px; }
      .label { font-size: 11px; fill: #c8c2b4; }
      .small { font-size: 10px; fill: #77786d; }
      .micro { font-size: 9px; fill: #6c6a61; }
      .cardTitle { font-size: 12px; font-weight: 650; fill: #e6e2d8; }
      .cardBody { font-size: 11px; fill: #969287; }
      .shortcut { font-size: 9px; font-weight: 600; fill: #77786d; }
      .icon { fill: none; stroke: #a7a397; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .iconMuted { fill: none; stroke: #64655b; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .iconBlue { fill: none; stroke: #9ac055; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
      .chev { fill: none; stroke: #77786d; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#pageBg)"/>
  <g class="ui">
    <text x="28" y="31" class="title">Viewport toolbar</text>
    <rect x="184" y="14" width="91" height="23" rx="11.5" fill="#202b17" stroke="#4b672f"/>
    <circle cx="198" cy="25.5" r="3" fill="#9ac055" filter="url(#blueGlow)"/>
    <text x="207" y="29.5" font-size="9.5" font-weight="650" letter-spacing=".8" fill="#b4da70">PROPOSTA V2</text>
    <text x="1572" y="29" text-anchor="end" class="subtitle">SmileEngine · Editor UI System</text>

    <!-- viewport -->
    <rect x="20" y="54" width="1560" height="420" rx="12" fill="url(#viewportBg)" stroke="#2c2f28"/>
    <clipPath id="viewportClip"><rect x="20" y="54" width="1560" height="420" rx="12"/></clipPath>
    <g clip-path="url(#viewportClip)">
      <path d="M20 287 C210 228 342 244 520 280 C727 322 894 253 1092 245 C1280 237 1432 275 1580 234 V474 H20Z" fill="#14211f"/>
      <path d="M20 335 C212 300 362 325 548 349 C765 377 970 315 1180 312 C1343 309 1472 338 1580 320 V474 H20Z" fill="#101715"/>
      <path d="M20 349 H1580 V474 H20Z" fill="url(#grid)" opacity=".78"/>
      <path d="M20 349H1580" stroke="#8fb5aa" stroke-opacity=".16"/>
      <ellipse cx="1082" cy="405" rx="155" ry="21" fill="#000" opacity=".34"/>
      <circle cx="1082" cy="306" r="92" fill="url(#orb)" stroke="#638084" stroke-opacity=".35"/>
      <ellipse cx="1052" cy="276" rx="34" ry="17" fill="#d5ffff" opacity=".1" transform="rotate(-28 1052 276)"/>

      <!-- selected object + gizmo -->
      <rect x="985" y="208" width="194" height="194" rx="3" fill="none" stroke="#5b9dff" stroke-opacity=".28" stroke-dasharray="4 5"/>
      <circle cx="1082" cy="306" r="3.5" fill="#e6e2d8"/>
      <path d="M1082 306V226" stroke="#57c878" stroke-width="2.5"/>
      <path d="M1082 226l-5 10h10z" fill="#57c878"/>
      <path d="M1082 306l75 22" stroke="#e85c5c" stroke-width="2.5"/>
      <path d="M1157 328l-11-6-3 10z" fill="#e85c5c"/>
      <path d="M1082 306l-54 39" stroke="#5b9dff" stroke-width="2.5"/>
      <path d="M1028 345l12-2-6-9z" fill="#5b9dff"/>

      <!-- toolbar base -->
      <rect x="20" y="54" width="1560" height="48" fill="#131410"/>
      <path d="M20 101.5H1580" stroke="#2a2c25"/>
      <rect x="20" y="54" width="1560" height="1" fill="#34372f" opacity=".7"/>

      <!-- add -->
      <g transform="translate(34 63)">
        <rect width="52" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M13 9v12M7 15h12" class="icon"/>
        <path d="M35 13l4 4 4-4" class="chev"/>
      </g>

      <!-- undo / redo -->
      <g transform="translate(91 63)">
        <rect width="30" height="30" rx="6" fill="transparent"/>
        <path d="M11 11H6v-5M6 11c2.2-3.7 7.3-5.1 11-2.8a8 8 0 0 1 2.4 11" class="icon" transform="translate(2 2)"/>
      </g>
      <g transform="translate(122 63)" opacity=".48">
        <rect width="30" height="30" rx="6" fill="transparent"/>
        <path d="M15 11h5v-5M20 11c-2.2-3.7-7.3-5.1-11-2.8a8 8 0 0 0-2.4 11" class="iconMuted" transform="translate(2 2)"/>
      </g>
      <path d="M160 68v20" stroke="#2d2f28"/>

      <!-- transform segmented control -->
      <g transform="translate(171 63)">
        <rect width="132" height="30" rx="6" fill="#181a15" stroke="#2b2d26"/>
        <path d="M33 1v28M66 1v28M99 1v28" stroke="#292b24"/>
        <!-- select -->
        <path d="M10 7l11 9-6 .8 3 6-3 1.5-3-6-4 4z" class="icon"/>
        <!-- move active -->
        <rect x="34" y="1" width="32" height="28" fill="url(#activeBg)"/>
        <path d="M50 6v18M41 15h18M50 6l-3 4M50 6l3 4M41 15l4-3M41 15l4 3M59 15l-4-3M59 15l-4 3M50 24l-3-4M50 24l3-4" class="iconBlue"/>
        <!-- rotate -->
        <path d="M79 9a8 8 0 1 1-2 8M76 8l3 1-1 3" class="icon"/>
        <!-- scale -->
        <rect x="108" y="7" width="6" height="6" rx="1" class="icon"/>
        <rect x="119" y="18" width="6" height="6" rx="1" class="icon"/>
        <path d="M113 13l7 6M117 19h3v-3" class="icon"/>
      </g>

      <!-- transform space -->
      <g transform="translate(310 63)">
        <rect width="82" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <circle cx="13" cy="15" r="5.5" class="icon"/>
        <path d="M13 7v16M7 15h12" class="icon"/>
        <text x="25" y="19" class="label">Global</text>
        <path d="M68 13l4 4 4-4" class="chev"/>
      </g>
      <path d="M402 68v20" stroke="#2d2f28"/>

      <!-- translate snap -->
      <g transform="translate(413 63)">
        <rect width="86" height="30" rx="6" fill="url(#activeBg)" stroke="#4b672f"/>
        <path d="M9 8v8a5 5 0 0 0 10 0V8M9 8h4v6a1 1 0 0 0 2 0V8h4" class="iconBlue"/>
        <text x="27" y="19" font-size="10.5" fill="#b4da70">10 cm</text>
        <path d="M72 13l4 4 4-4" class="chev"/>
      </g>
      <!-- rotation snap -->
      <g transform="translate(503 63)">
        <rect width="68" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M9 20a8 8 0 0 1 8-11M17 9l-3-2m3 2-2 3" class="icon"/>
        <text x="26" y="19" class="label">15°</text>
        <path d="M54 13l4 4 4-4" class="chev"/>
      </g>
      <!-- scale snap -->
      <g transform="translate(575 63)">
        <rect width="72" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M9 20L19 10M10 11h.1M18 19h.1" stroke="#a7a397" stroke-width="2.2" stroke-linecap="round"/>
        <text x="27" y="19" class="label">10%</text>
        <path d="M58 13l4 4 4-4" class="chev"/>
      </g>
      <path d="M657 68v20" stroke="#2d2f28"/>

      <!-- camera / view -->
      <g transform="translate(668 63)">
        <rect width="112" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M10 11h11v8H10zM21 13l5-3v10l-5-3" class="icon"/>
        <text x="33" y="19" class="label">Perspectiva</text>
        <path d="M98 13l4 4 4-4" class="chev"/>
      </g>
      <g transform="translate(786 63)">
        <rect width="70" height="30" rx="6" fill="url(#activeBg)" stroke="#4b672f"/>
        <circle cx="13" cy="15" r="5.5" fill="#9ac055" opacity=".18"/>
        <path d="M9 16l3-4 3 2 3-5" class="iconBlue"/>
        <text x="25" y="19" font-size="11" fill="#b4da70">Lit</text>
        <path d="M56 13l4 4 4-4" class="chev"/>
      </g>
      <g transform="translate(862 63)">
        <rect width="88" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M9 15s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z" class="icon"/>
        <circle cx="17" cy="15" r="2.2" class="icon"/>
        <text x="31" y="19" class="label">Mostrar</text>
        <path d="M74 13l4 4 4-4" class="chev"/>
      </g>

      <!-- right tools -->
      <g transform="translate(1244 63)">
        <rect width="34" height="30" rx="6" fill="transparent"/>
        <path d="M8 19l4-7 7-4 7 2-4 7-7 4zM15 21l-2 4M22 17l4 2" class="icon"/>
        <circle cx="17" cy="15" r="2" fill="#a7a397"/>
      </g>
      <g transform="translate(1282 63)">
        <rect width="86" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M9 19l8-8M10 10h5v5" class="icon"/>
        <text x="27" y="19" class="label">4,0×</text>
        <path d="M72 13l4 4 4-4" class="chev"/>
      </g>
      <g transform="translate(1374 63)">
        <rect width="72" height="30" rx="6" fill="#1b1d18" stroke="#2e3029"/>
        <path d="M9 21v-5M14 21V9M19 21v-8" class="icon"/>
        <text x="27" y="19" class="label">Stats</text>
      </g>
      <g transform="translate(1452 63)">
        <rect width="34" height="30" rx="6" fill="url(#activeBg)" stroke="#4b672f"/>
        <path d="M9 8v14M15 8v14M21 8v14M8 9h14M8 15h14M8 21h14" class="iconBlue"/>
      </g>
      <g transform="translate(1490 63)">
        <rect width="34" height="30" rx="6" fill="transparent"/>
        <path d="M9 14V9h5M20 9h5v5M25 20v5h-5M14 25H9v-5" class="icon"/>
      </g>
      <g transform="translate(1528 63)">
        <rect width="34" height="30" rx="6" fill="transparent"/>
        <circle cx="17" cy="15" r="1.3" fill="#a7a397"/>
        <circle cx="17" cy="10" r="1.3" fill="#a7a397"/>
        <circle cx="17" cy="20" r="1.3" fill="#a7a397"/>
      </g>

      <!-- snapping popup -->
      <g transform="translate(413 111)" filter="url(#shadow)">
        <path d="M30 0l6 7H24z" fill="#24271f" stroke="#383b32"/>
        <rect y="7" width="312" height="238" rx="9" fill="url(#glass)" stroke="#383b32"/>
        <text x="16" y="31" font-size="10" font-weight="650" letter-spacing=".7" fill="#77786d">SNAP DE TRANSFORMAÇÃO</text>
        <text x="296" y="31" text-anchor="end" font-size="8.5" fill="#6c6a61">Shift: ignorar snap</text>
        <path d="M14 43H298" stroke="#2b2d26"/>

        <text x="16" y="67" class="label">Movimento</text>
        <g transform="translate(16 77)">
          <rect width="280" height="32" rx="5" fill="#151713" stroke="#2d3028"/>
          <rect x="1" y="1" width="54" height="30" rx="4" fill="#26351a"/>
          <text x="28" y="20" text-anchor="middle" font-size="10" fill="#b4da70">10 cm</text>
          <text x="82" y="20" text-anchor="middle" class="small">1 cm</text>
          <text x="134" y="20" text-anchor="middle" class="small">50 cm</text>
          <text x="190" y="20" text-anchor="middle" class="small">1 m</text>
          <text x="251" y="20" text-anchor="middle" class="small">Custom</text>
        </g>

        <text x="16" y="133" class="label">Rotação</text>
        <g transform="translate(16 143)">
          <rect width="132" height="32" rx="5" fill="#151713" stroke="#2d3028"/>
          <rect x="1" y="1" width="43" height="30" rx="4" fill="#25271f"/>
          <text x="22" y="20" text-anchor="middle" class="small">5°</text>
          <rect x="44" y="1" width="43" height="30" fill="#26351a"/>
          <text x="65" y="20" text-anchor="middle" font-size="10" fill="#b4da70">15°</text>
          <text x="109" y="20" text-anchor="middle" class="small">45°</text>
        </g>
        <text x="164" y="133" class="label">Escala</text>
        <g transform="translate(164 143)">
          <rect width="132" height="32" rx="5" fill="#151713" stroke="#2d3028"/>
          <text x="22" y="20" text-anchor="middle" class="small">1%</text>
          <rect x="44" y="1" width="43" height="30" fill="#26351a"/>
          <text x="65" y="20" text-anchor="middle" font-size="10" fill="#b4da70">10%</text>
          <text x="109" y="20" text-anchor="middle" class="small">25%</text>
        </g>

        <path d="M14 190H298" stroke="#2b2d26"/>
        <rect x="16" y="204" width="16" height="16" rx="4" fill="#9ac055"/>
        <path d="M20 212l3 3 6-7" fill="none" stroke="#f5f7fb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="217" class="label">Snap relativo à origem do objeto</text>
      </g>

      <!-- hover tooltip -->
      <g transform="translate(180 107)" filter="url(#softShadow)">
        <rect width="86" height="26" rx="5" fill="#272921" stroke="#3b3d34"/>
        <text x="10" y="17" class="label">Mover</text>
        <text x="75" y="17" text-anchor="end" class="shortcut">W</text>
      </g>
    </g>

    <!-- rationale cards -->
    <g transform="translate(20 494)">
      <rect width="500" height="196" rx="10" fill="#141610" stroke="#2b2e26"/>
      <rect x="16" y="16" width="28" height="28" rx="7" fill="#202b17" stroke="#4b672f"/>
      <path d="M30 21v18M21 30h18M30 21l-3 4M30 21l3 4M21 30l4-3M21 30l4 3M39 30l-4-3M39 30l-4 3" class="iconBlue"/>
      <text x="56" y="29" class="cardTitle">Criação e transformação</text>
      <text x="56" y="43" class="small">Fluxo primário à esquerda, perto da área de trabalho</text>
      <path d="M16 58H484" stroke="#272a23"/>
      <text x="18" y="83" class="cardBody">Adicionar</text><text x="166" y="83" class="small">atores, luzes, volumes e câmeras</text>
      <text x="18" y="107" class="cardBody">Histórico</text><text x="166" y="107" class="small">desfazer/refazer com estado desabilitado</text>
      <text x="18" y="131" class="cardBody">Ferramentas</text><text x="166" y="131" class="small">selecionar · mover · rotacionar · escalar</text>
      <text x="18" y="155" class="cardBody">Referencial</text><text x="166" y="155" class="small">global/local e pivot/centro</text>
      <text x="18" y="179" class="cardBody">Snapping</text><text x="166" y="179" class="small">valores editáveis + Shift temporário</text>
    </g>

    <g transform="translate(538 494)">
      <rect width="500" height="196" rx="10" fill="#141610" stroke="#2b2e26"/>
      <rect x="16" y="16" width="28" height="28" rx="7" fill="#201f18" stroke="#3b3a30"/>
      <path d="M22 26h12v8H22zM34 28l5-3v10l-5-3" class="icon"/>
      <text x="56" y="29" class="cardTitle">Câmera e enquadramento</text>
      <text x="56" y="43" class="small">Controles previsíveis, com atalhos de engine</text>
      <path d="M16 58H484" stroke="#272a23"/>
      <text x="18" y="83" class="cardBody">Projeção</text><text x="166" y="83" class="small">perspectiva e vistas ortográficas</text>
      <text x="18" y="107" class="cardBody">Focar seleção</text><text x="166" y="107" class="small">tecla F e órbita no pivot selecionado</text>
      <text x="18" y="131" class="cardBody">Velocidade</text><text x="166" y="131" class="small">preset + ajuste com roda do mouse</text>
      <text x="18" y="155" class="cardBody">Pilotar câmera</text><text x="166" y="155" class="small">alinhar e pilotar câmera da cena</text>
      <text x="18" y="179" class="cardBody">Maximizar</text><text x="166" y="179" class="small">viewport imersivo sem perder o layout</text>
    </g>

    <g transform="translate(1056 494)">
      <rect width="524" height="196" rx="10" fill="#141610" stroke="#2b2e26"/>
      <rect x="16" y="16" width="28" height="28" rx="7" fill="#202b17" stroke="#4b672f"/>
      <path d="M22 30s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z" class="iconBlue"/>
      <circle cx="30" cy="30" r="2" fill="#9ac055"/>
      <text x="56" y="29" class="cardTitle">Visualização e diagnóstico</text>
      <text x="56" y="43" class="small">Ferramentas secundárias agrupadas à direita</text>
      <path d="M16 58H508" stroke="#272a23"/>
      <text x="18" y="83" class="cardBody">View modes</text><text x="166" y="83" class="small">Lit, wireframe, buffers e heatmaps</text>
      <text x="18" y="107" class="cardBody">Mostrar</text><text x="166" y="107" class="small">grade, gizmos, luzes, volumes e colisões</text>
      <text x="18" y="131" class="cardBody">Stats</text><text x="166" y="131" class="small">FPS, frame time, GPU/CPU e VRAM</text>
      <text x="18" y="155" class="cardBody">Estado ativo</text><text x="166" y="155" class="small">azul; hover neutro; indisponível atenuado</text>
      <text x="18" y="179" class="cardBody">Responsivo</text><text x="166" y="179" class="small">rótulos recolhem; excedente vai para •••</text>
    </g>
  </g>
</svg>
